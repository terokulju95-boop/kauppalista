<!DOCTYPE html>
<html lang='fi'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1'>
<title>Kauppalistat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg);}
  33%{transform:translateY(-20px) rotate(2deg);}
  66%{transform:translateY(10px) rotate(-2deg);}
}
@keyframes gradient-text{
  0%,100%{background-position:0% center;}
  50%{background-position:100% center;}
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeOut{
  0%{opacity:1;transform:translateX(0) scale(1);}
  50%{opacity:0.5;transform:translateX(20px) scale(0.95);}
  100%{opacity:0;transform:translateX(60px) scale(0.8);height:0;padding:0;margin:0;}
}

body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  color:#ffffff;min-height:100vh;
  position:relative;background:#0a0a0f;
}
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 20% 20%,rgba(255,152,48,0.15) 0%,transparent 40%),
    radial-gradient(circle at 80% 80%,rgba(138,43,226,0.12) 0%,transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(30,144,255,0.08) 0%,transparent 50%);
  animation:float 20s ease-in-out infinite;pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0px,transparent 1px,transparent 2px,rgba(255,255,255,0.02) 3px);
  pointer-events:none;z-index:1;opacity:0.5;
}
.container{position:relative;z-index:2;width:100%;max-width:450px;margin:0 auto;padding:24px;min-height:100vh;}
.header{text-align:center;margin-bottom:30px;padding:20px 0;}
h1{
  pointer-events:none;
  font-size:38px;font-weight:700;letter-spacing:1px;margin-bottom:6px;
  background:linear-gradient(135deg,#ff9830 0%,#ffb366 50%,#ff9830 100%);
  background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:gradient-text 3s ease infinite;
  filter:drop-shadow(0 2px 8px rgba(255,152,48,0.3));
}
.subtitle{pointer-events:none;color:#888;font-size:13px;letter-spacing:4px;text-transform:uppercase;font-weight:400;}

/* Käyttäjävalinta */
.user-switcher{
  display:flex;gap:10px;margin-bottom:20px;
  background:rgba(20,20,30,0.6);border-radius:16px;padding:6px;
  border:1px solid rgba(255,255,255,0.1);
}
.user-btn{
  flex:1;padding:12px;border-radius:12px;border:none;
  font-size:16px;font-weight:800;cursor:pointer;letter-spacing:1px;
  transition:all 0.3s ease;background:transparent;color:#888;
  text-transform:uppercase;
}
.user-btn.active{
  background:linear-gradient(135deg,#ff9830 0%,#ff7a00 100%);
  color:#000;box-shadow:0 4px 15px rgba(255,152,48,0.4);
}
.user-badge{
  display:inline-block;margin-left:6px;background:rgba(255,152,48,0.3);
  color:#ff9830;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;
}

.glass-card{
  background:rgba(20,20,30,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;margin-bottom:20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.glass-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.15);
  border-color:rgba(255,152,48,0.3);
}
input{
  background:rgba(30,30,40,0.8);border:2px solid rgba(255,255,255,0.1);border-radius:14px;
  padding:14px 18px;width:100%;color:#ffffff;font-size:16px;text-transform:uppercase;
  font-weight:600;letter-spacing:0.5px;transition:all 0.3s ease;outline:none;
}
input::placeholder{color:rgba(255,255,255,0.3);}
input:focus{
  border-color:#ff9830;background:rgba(30,30,40,0.95);
  box-shadow:0 0 0 4px rgba(255,152,48,0.1);transform:translateY(-1px);
}
button{
  background:linear-gradient(135deg,#ff9830 0%,#ff7a00 100%);border:0;
  border-radius:14px;padding:14px 24px;color:#000000;font-weight:800;font-size:16px;
  cursor:pointer;text-transform:uppercase;letter-spacing:1px;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 4px 15px rgba(255,152,48,0.4);position:relative;overflow:hidden;
}
button::before{
  content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;
  background:rgba(255,255,255,0.3);transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s;
}
button:hover::before{width:300px;height:300px;}
button:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,152,48,0.6);}
button:active{transform:translateY(0) scale(0.98);}
.btn-add{min-width:90px;}
.row{display:flex;width:100%;gap:12px;align-items:stretch;}
.listRow{
  background:rgba(25,25,40,0.7);backdrop-filter:blur(10px);border-radius:16px;
  padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:2px solid transparent;position:relative;overflow:hidden;
}
.listRow::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,152,48,0.1),transparent);transition:left 0.5s;
}
.listRow:hover::before{left:100%;}
.listRow:hover{background:rgba(35,35,50,0.8);transform:translateX(4px);}
.listRow.active{
  border-color:#ff9830;background:rgba(255,152,48,0.1);
  box-shadow:0 0 20px rgba(255,152,48,0.2);
}
.listRow.active::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#ff9830,#ff7a00);box-shadow:0 0 10px rgba(255,152,48,0.8);
}
.listTitleText{font-size:20px;font-weight:700;flex:1;letter-spacing:1px;color:#ffffff;transition:color 0.3s;}
.listRow.active .listTitleText{color:#ff9830;}
.count-badge{
  background:rgba(255,152,48,0.2);color:#ff9830;padding:4px 12px;border-radius:20px;
  font-size:13px;font-weight:700;margin-right:12px;border:1px solid rgba(255,152,48,0.3);
}
.delList,.del{
  background:linear-gradient(135deg,#ff4d4d 0%,#cc0000 100%);color:#ffffff;
  border-radius:12px;width:40px;height:40px;display:flex;justify-content:center;
  align-items:center;font-weight:900;font-size:20px;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:0;cursor:pointer;box-shadow:0 4px 12px rgba(255,77,77,0.4);flex-shrink:0;
}
.delList:hover,.del:hover{transform:rotate(90deg) scale(1.1);box-shadow:0 6px 20px rgba(255,77,77,0.6);}
.delList:active,.del:active{transform:rotate(90deg) scale(1);}
.item{
  background:rgba(25,25,40,0.6);backdrop-filter:blur(10px);border-radius:16px;
  padding:18px 20px;margin-bottom:12px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:2px solid rgba(255,255,255,0.05);position:relative;
}
.item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#4a9eff,#1e90ff);opacity:0;
  transition:opacity 0.3s;border-radius:16px 0 0 16px;
}
.item:hover{background:rgba(35,35,50,0.8);transform:translateX(4px);border-color:rgba(74,158,255,0.3);}
.item:hover::before{opacity:1;}
.item.doneState{opacity:0.5;background:rgba(20,40,20,0.4);}
.item.doneState::before{background:linear-gradient(180deg,#4ade80,#22c55e);}
.name{font-size:18px;font-weight:600;transition:all 0.3s ease;flex:1;letter-spacing:0.5px;}
.done{text-decoration:line-through;opacity:0.6;}
.kpl{
  opacity:0.7;margin-right:14px;font-size:15px;font-weight:600;color:#a0a0a0;
  transition:all 0.3s ease;padding:6px 12px;background:rgba(255,255,255,0.05);border-radius:8px;
}
.fadeOut{animation:fadeOut 0.4s cubic-bezier(0.4,0,1,1) forwards;}
.clearBtn{
  background:linear-gradient(135deg,#ff4d4d 0%,#cc0000 100%);color:#ffffff;
  width:100%;font-size:16px;padding:16px;border-radius:14px;border:0;margin-top:24px;
  font-weight:800;text-transform:uppercase;letter-spacing:1px;
  box-shadow:0 4px 15px rgba(255,77,77,0.4);cursor:pointer;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.clearBtn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,77,77,0.6);}
.clearBtn:active{transform:translateY(0) scale(0.98);}
.divider{
  height:2px;background:linear-gradient(90deg,transparent,rgba(255,152,48,0.3),transparent);
  margin:32px 0;border:0;position:relative;
}
.divider::after{
  content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#0a0a0f;padding:0 12px;color:#ff9830;font-size:12px;
}
#activeArea{animation:slideIn 0.4s cubic-bezier(0.4,0,0.2,1);}
.list-title-section{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;padding:20px;
  background:rgba(255,152,48,0.05);border-radius:16px;border:1px solid rgba(255,152,48,0.2);
}
.list-title-section h2{color:#ff9830;font-size:28px;font-weight:800;letter-spacing:1px;margin:0;}
.empty-state{text-align:center;padding:60px 20px;opacity:0.5;}
.empty-state-icon{font-size:64px;margin-bottom:16px;opacity:0.3;}
.empty-state-text{font-size:16px;color:#a0a0a0;letter-spacing:1px;}
html{scroll-behavior:smooth;}
::selection{background:rgba(255,152,48,0.3);color:#ffffff;}

/* Tallennusindikaattori */
#saveStatus{
  position:fixed;top:0;left:0;right:0;padding:8px;text-align:center;
  font-size:13px;font-weight:700;z-index:9999;transition:opacity 0.5s;opacity:0;
  pointer-events:none;
}

/* Päivitysilmoitus */
#updateBar{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:10000;
  display:none;align-items:center;gap:12px;
  background:rgba(20,20,30,0.96);backdrop-filter:blur(20px);
  border:1px solid rgba(255,152,48,0.4);border-radius:16px;padding:14px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
}
#updateBar.show{display:flex;animation:slideIn 0.3s cubic-bezier(0.4,0,0.2,1);}
#updateBar .txt{flex:1;font-size:14px;font-weight:600;color:#fff;letter-spacing:0.3px;}
#updateBar button{padding:10px 16px;font-size:14px;border-radius:12px;flex-shrink:0;}
/* ---------- Kategoriaotsikot ---------- */
.catHeader{
  display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding:0 4px;
  font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8b8ba0;
}
.catHeader:first-child{margin-top:4px;}
.catHeader .catIcon{font-size:16px;letter-spacing:0;}
.catHeader .catLine{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0.14),transparent);}
.catHeader .catCount{color:#5f5f75;font-weight:700;letter-spacing:1px;}
.catHeader.doneHeader{color:#4ade80;cursor:pointer;user-select:none;margin-top:26px;}
.catHeader.doneHeader .catLine{background:linear-gradient(90deg,rgba(74,222,128,0.25),transparent);}
.catHeader.doneHeader .chev{transition:transform 0.25s ease;font-size:11px;}
.catHeader.doneHeader.collapsed .chev{transform:rotate(-90deg);}

/* ---------- Edistyminen ---------- */
.list-title-section{flex-direction:column;align-items:stretch;gap:14px;}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.progressWrap{display:flex;align-items:center;gap:12px;}
.progressBar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,0.08);overflow:hidden;}
.progressFill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4ade80,#22c55e);transition:width 0.45s cubic-bezier(0.4,0,0.2,1);}
.progressText{font-size:12px;font-weight:700;letter-spacing:1px;color:#9a9ab0;white-space:nowrap;}
.hideBtn{
  background:rgba(255,255,255,0.06);color:#c8c8d8;border:1px solid rgba(255,255,255,0.12);
  box-shadow:none;padding:9px 14px;font-size:11px;letter-spacing:1px;border-radius:11px;white-space:nowrap;
}
.hideBtn:hover{background:rgba(255,255,255,0.12);color:#fff;transform:none;box-shadow:none;}

/* ---------- Ehdotukset ---------- */
.suggWrap{margin-top:12px;display:none;}
.suggWrap.show{display:block;animation:slideIn 0.25s cubic-bezier(0.4,0,0.2,1);}
.suggLabel{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#6f6f88;margin-bottom:8px;}
.suggChips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:rgba(74,158,255,0.12);border:1px solid rgba(74,158,255,0.35);color:#9dcaff;
  border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;letter-spacing:0.5px;
  cursor:pointer;box-shadow:none;text-transform:uppercase;
}
.chip:hover{background:rgba(74,158,255,0.22);color:#fff;transform:none;box-shadow:none;}
.chip:active{transform:scale(0.96);}
.chip .chipIcon{margin-right:6px;}

/* ---------- Muokkaus ---------- */
.item.editing{border-color:rgba(255,152,48,0.55);background:rgba(40,32,22,0.92);cursor:default;flex-direction:column;align-items:stretch;gap:10px;}
.item.editing:hover{transform:none;background:rgba(40,32,22,0.92);}
.editGrid{display:flex;gap:10px;align-items:stretch;}
/* Määrän säädin pidetään kompaktina ja kategoriavalinta saa loppu tilan.
   min-width:0 on pakollinen: ilman sitä select ei suostu kutistumaan
   flex-lapsena, vaan työntäisi säätimen rivin ulkopuolelle. */
.editGrid .qtyBox{flex:0 0 auto;}
.editGrid .catBox{flex:1 1 auto;min-width:0;}
.item.editing input,.item.editing select{
  padding:12px 14px;font-size:15px;border-radius:12px;text-transform:none;
}
.item.editing select{
  width:100%;background:rgba(30,30,40,0.9);border:2px solid rgba(255,255,255,0.1);
  color:#fff;font-weight:600;font-family:inherit;outline:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff9830' stroke-width='3'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:38px;
}
.item.editing select:focus{border-color:#ff9830;}
.editActions{display:flex;gap:10px;}
.editActions button{flex:1;padding:12px;font-size:14px;}
.btnCancel{background:rgba(255,255,255,0.08);color:#d8d8e8;box-shadow:none;border:1px solid rgba(255,255,255,0.12);}
.btnCancel:hover{background:rgba(255,255,255,0.16);color:#fff;box-shadow:none;}

/* ---------- Rivin napit ---------- */
.rowBtns{display:flex;align-items:center;gap:8px;}
.edit{
  background:rgba(255,255,255,0.07);color:#cfcfe4;border:1px solid rgba(255,255,255,0.14);
  border-radius:12px;width:38px;height:38px;display:flex;justify-content:center;align-items:center;
  font-size:16px;cursor:pointer;box-shadow:none;flex-shrink:0;padding:0;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.edit:hover{background:rgba(255,152,48,0.18);border-color:rgba(255,152,48,0.5);color:#ff9830;transform:none;box-shadow:none;}
.edit:active{transform:scale(0.92);}
.del{width:38px;height:38px;font-size:18px;}
.kpl{margin-right:10px;padding:5px 10px;font-size:14px;}
.name{font-size:17px;}

/* ---------- Pitkien nimien rivitys ---------- */
/* Flex-elementin oletus min-width:auto estää kutistumisen, jolloin pitkä
   yhdyssana työntää napit ruudun ulkopuolelle. Nollaus + sanan katkaisu. */
/* HUOM: overflow-x:hidden rikkoisi #topbarin position:sticky -toiminnan.
   Vaakavuoto on estetty oikeasta syystä: .name saa kutistua ja rivittyä. */
.item{gap:10px;}
/* break-word katkaisee sanan vasta kun se ei muuten mahdu, toisin kuin
   anywhere, joka katkoo herkästi keskeltä lyhyitäkin nimiä. */
.item .name{flex:1 1 auto;min-width:0;overflow-wrap:break-word;}
.rowBtns{flex:0 0 auto;gap:6px;}
.kpl{white-space:nowrap;flex-shrink:0;margin-right:6px;padding:4px 8px;font-size:13px;}
/* Tilaa nimelle: kapeampi sisennys ja hieman pienemmät napit */
.item{padding:16px;gap:8px;}
.edit,.del{width:36px;height:36px;}
.listRow{gap:10px;}
.listTitleText{min-width:0;overflow-wrap:break-word;}
.listRow > div:last-child{flex-shrink:0;}
.titleRow h2{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;word-break:break-word;}
.hideBtn{flex:0 0 auto;}
.chip{max-width:100%;overflow-wrap:break-word;text-align:left;}
.catHeader > span:nth-child(2){min-width:0;overflow-wrap:break-word;}
.item.editing input,.item.editing select{max-width:100%;}


/* ============ KAKSI NÄKYMÄÄ ============ */
#topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  /* Reunasta reunaan, jotta palkilla ei ole näkyviä sivureunoja */
  margin:0 -24px 20px;padding:18px 24px 18px;
  background:transparent;
  transition:background 0.25s ease, box-shadow 0.25s ease;
}
/* Tausta ilmestyy vasta kun sisältöä valuu palkin alle. Ylhäällä palkki
   on läpinäkyvä, jolloin se ei näytä irralliselta laatikolta. */
#topbar.kiinni{
  background:rgba(16,16,26,0.9);
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
#topbar .takaisin{
  width:54px;height:54px;flex:0 0 54px;border-radius:17px;padding:0;
  font-size:30px;font-weight:400;line-height:1;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
  color:#fff;box-shadow:none;display:flex;align-items:center;justify-content:center;
}
#topbar .takaisin:hover{background:rgba(255,152,48,0.16);border-color:rgba(255,152,48,0.5);
  color:#ff9830;transform:none;box-shadow:none;}
#topbar .takaisin:active{transform:scale(0.93);}
#topbar .nimi{
  flex:1;min-width:0;font-size:26px;font-weight:800;letter-spacing:1px;color:#ff9830;
  overflow-wrap:break-word;line-height:1.15;
  filter:drop-shadow(0 2px 10px rgba(255,152,48,0.25));
}
/* Edistyminen ohuena viivana palkin alareunassa, ei erillisenä palikkana */
#topbar .viiva{position:absolute;left:0;right:0;bottom:0;height:3px;
  background:rgba(255,255,255,0.07);overflow:hidden;}
#topbar .taytto{height:100%;width:0;
  background:linear-gradient(90deg,#4ade80,#22c55e);
  box-shadow:0 0 10px rgba(74,222,128,0.5);
  transition:width 0.45s cubic-bezier(0.4,0,0.2,1);}
#topbar .luku{font-size:13px;font-weight:700;color:#9a9ab0;letter-spacing:1px;white-space:nowrap;}

.isoNappi{width:100%;padding:19px;font-size:16px;}
#uusiListaBtn{margin-top:4px;}
#lisaaAuki{
  background:rgba(255,152,48,0.13);color:#ff9830;
  border:1px solid rgba(255,152,48,0.42);box-shadow:none;margin-bottom:18px;
}
#lisaaAuki:hover{background:rgba(255,152,48,0.22);transform:none;box-shadow:none;}

/* Näkymän mukainen näkyvyys */
body[data-view="lista"] .header,
body[data-view="lista"] .user-switcher,
body[data-view="lista"] #luontiKortti,
body[data-view="lista"] #uusiListaBtn,
body[data-view="lista"] #listContainer,
body[data-view="lista"] .divider,
body[data-view="lista"] .list-title-section{display:none !important;}

body[data-view="listat"] #topbar,
body[data-view="listat"] #activeArea,
body[data-view="listat"] .divider,
body[data-view="listat"] #lisaaAuki{display:none !important;}

/* Lisäyslomake napin takana */
body[data-view="lista"] #activeArea > .glass-card{display:none;}
body.lisays-auki[data-view="lista"] #activeArea > .glass-card{display:block;}
body.lisays-auki #lisaaAuki{display:none !important;}

/* Listanäkymä: kevyempi otsikko, isommat listarivit */
body[data-view="listat"] .header{padding:14px 0 18px;}
body[data-view="listat"] h1{font-size:28px;}
body[data-view="listat"] .subtitle{font-size:11px;letter-spacing:3px;}

/* ============ NÄKYMÄN VAIHDON LIUKU ============ */
@keyframes navUlosVasemmalle{ to{ transform:translateX(-24%); opacity:0; } }
@keyframes navSisaanOikealta{ from{ transform:translateX(100%); } }
@keyframes navUlosOikealle{ to{ transform:translateX(100%); } }
@keyframes navSisaanVasemmalta{ from{ transform:translateX(-24%); opacity:0; } }

html.nav-eteen::view-transition-old(root){
  animation:navUlosVasemmalle 0.30s cubic-bezier(0.32,0.72,0,1) both;}
html.nav-eteen::view-transition-new(root){
  animation:navSisaanOikealta 0.30s cubic-bezier(0.32,0.72,0,1) both;z-index:2;}
html.nav-taakse::view-transition-old(root){
  animation:navUlosOikealle 0.30s cubic-bezier(0.32,0.72,0,1) both;z-index:2;}
html.nav-taakse::view-transition-new(root){
  animation:navSisaanVasemmalta 0.30s cubic-bezier(0.32,0.72,0,1) both;}
html.nav-eteen::view-transition-old(root),html.nav-eteen::view-transition-new(root),
html.nav-taakse::view-transition-old(root),html.nav-taakse::view-transition-new(root){
  mix-blend-mode:normal;}

/* ============ MÄÄRÄN SÄÄDIN ============ */
.maaraSaadin{display:flex;align-items:stretch;gap:0;flex:0 0 auto;
  border:2px solid rgba(255,255,255,0.1);border-radius:14px;
  background:rgba(30,30,40,0.8);overflow:hidden;}
.maaraSaadin input{border:0;border-radius:0;background:transparent;text-align:center;
  width:50px;flex:0 0 50px;padding:14px 2px;font-size:17px;}
.maaraSaadin input:focus{box-shadow:none;transform:none;background:rgba(255,152,48,0.08);}
.maaraNappi{
  flex:0 0 46px;width:46px;padding:0;border-radius:0;border:0;
  background:rgba(255,255,255,0.06);color:#ff9830;
  font-size:26px;font-weight:700;line-height:1;box-shadow:none;
  display:flex;align-items:center;justify-content:center;
}

.maaraNappi:active{background:rgba(255,152,48,0.35);transform:none;}
.maaraNappi::before{display:none;}
.btn-add{white-space:nowrap;}
/* Lisäysnappi kevyemmäksi, jotta teksti mahtuu säätimen viereen */
.lisaysRivi{align-items:stretch;}
.lisaysRivi .btn-add{font-size:15px;letter-spacing:0.5px;padding:14px 12px;}
/* Kapealla ruudulla nappi siirtyy omalle rivilleen */
@media (max-width: 380px){
  .lisaysRivi{flex-wrap:wrap;}
  .lisaysRivi .maaraSaadin{flex:0 0 auto;}
  .lisaysRivi .btn-add{flex:1 1 100% !important;}
}
/* Muokkausnäkymässä säädin ei saa venyä.
   Tekstikentän luontainen leveys on n. 20 merkkiä, ja koska flex-lapsen
   min-width on oletuksena auto, kenttä kieltäytyy kutistumasta sen alle.
   Se söi koko rivin kolmella tavalla: kategoriavalinnasta jäi näkyviin vain
   nuoli, säädin venyi suhteettoman isoksi, ja +-nappi leikkautui pois
   .maaraSaadin-laatikon overflow:hidden -reunan taakse.
   Kiinteä leveys + min-width:0 korjaa kaikki kolme.
   HUOM: nämä valitsimet ovat tarkempia kuin .editGrid .qtyBox, joten
   leveys on määriteltävä täällä – ei siellä. */
.item.editing .maaraSaadin{flex:0 0 auto;}
.item.editing .maaraSaadin input{flex:0 0 46px;width:46px;min-width:0;padding:12px 2px;}
.item.editing .maaraNappi{flex:0 0 44px;width:44px;font-size:24px;}

/* Kapealla ruudulla kategorian nimestä näkyisi vierekkäin vain pari
   kirjainta, joten säädin ja valinta latotaan päällekkäin täyteen
   leveyteen. Raja 400px: alle jäävät mm. iPhone 15 (393px). */
@media (max-width: 400px){
  .editGrid{flex-wrap:wrap;}
  .item.editing .editGrid .maaraSaadin{flex:1 1 100%;}
  .item.editing .editGrid .maaraSaadin input{flex:1 1 auto;width:auto;}
  .editGrid .catBox{flex:1 1 100%;}
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, collection, getDoc, getDocs, setDoc, deleteDoc, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDswdEF9J0gsHJH6Zo_8BGZrf8DVG3FwYc",
  authDomain: "hakemuspaivakirja.firebaseapp.com",
  projectId: "hakemuspaivakirja",
  storageBucket: "hakemuspaivakirja.firebasestorage.app",
  messagingSenderId: "836133210317",
  appId: "1:836133210317:web:d85131ae272ecf1938c184"
};

const app = initializeApp(firebaseConfig);

// Firestoren oma offline-varasto (IndexedDB): kirjoitukset tallentuvat
// puhelimeen heti ja jonottuvat itsestään kunnes verkko palaa.
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

// Käyttäjillä on PYSYVÄ tunniste erillään näyttönimestä. Listat sijaitsevat
// polussa kauppalista/{tunniste}/lists, joten nimen vaihto ei saa siirtää dataa.
const OLETUSKAYTTAJAT = [
  { id: 'TERO', nimi: 'TERO', emoji: '🧔' },
  { id: 'ISKÄ', nimi: 'ISKÄ', emoji: '👴' }
];
let KAYTTAJAT = OLETUSKAYTTAJAT.map(k => ({ ...k }));
const USERS = () => KAYTTAJAT.map(k => k.id);
const kayttaja = (id) => KAYTTAJAT.find(k => k.id === id) || { id, nimi: id, emoji: '👤' };

let states  = {};
let active  = {};
let lastSig = {};
function varmistaTilat(){
  for (const id of USERS()){
    if (!states[id]) states[id] = { lists: [] };
    if (!(id in active)) active[id] = null;
    if (!(id in lastSig)) lastSig[id] = null;
  }
}
varmistaTilat();

let currentUser = localStorage.getItem('kauppalista_user') || 'TERO';
if (!USERS().includes(currentUser)) currentUser = USERS()[0] || 'TERO';

const unsubs = {};
let pendingWrites = false;
let ready = false;

let editingId = null;   // muokattavana oleva tuote
let editBuf = null;     // {name, qty, cat} – säilyy vaikka näkymä piirtyisi uusiksi
let hideDone = false;
let doneCollapsed = false;
let vtTarget = null;   // ainoa rivi jolle annetaan view-transition-name

const rid = () => Math.random().toString(36).slice(2, 11);
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function readJSON(key, fallback){
  try { const raw = localStorage.getItem(key); return raw ? (JSON.parse(raw) ?? fallback) : fallback; }
  catch(e){ return fallback; }
}
function writeJSON(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){}
}

// ============================================================
//  KAUPPAJÄRJESTYS
//  Ylhäältä alas siinä järjestyksessä kuin kaupassa kävellään.
//  Vaihda rivien järjestystä jos oma kauppasi on eri mallinen.
// ============================================================
const PERUSKATEGORIAT = [
  { id:'hevi',     name:'Hedelmät ja vihannekset', icon:'🥬', color:'#4ade80' },
  { id:'leipa',    name:'Leipä ja leivonnaiset',   icon:'🍞', color:'#e0a066' },
  { id:'liha',     name:'Liha ja kala',            icon:'🥩', color:'#ff7b72' },
  { id:'maito',    name:'Maito, juusto ja munat',  icon:'🥛', color:'#7dd3fc' },
  { id:'eines',    name:'Einekset ja valmisruoat', icon:'🍱', color:'#fbbf24' },
  { id:'kuiva',    name:'Kuivatuotteet',           icon:'🍝', color:'#d7be8b' },
  { id:'mauste',   name:'Mausteet ja leivonta',    icon:'🧂', color:'#c4a0fc' },
  { id:'herkku',   name:'Herkut ja naposteltavat', icon:'🍫', color:'#f49ac2' },
  { id:'juoma',    name:'Juomat',                  icon:'🧃', color:'#38bdf8' },
  { id:'pakaste',  name:'Pakasteet',               icon:'🧊', color:'#a5b4fc' },
  { id:'koti',     name:'Koti ja siivous',         icon:'🧻', color:'#a3b2c2' },
  { id:'hygienia', name:'Hygienia ja kauneus',     icon:'🧼', color:'#5eead4' },
  { id:'apteekki', name:'Apteekki ja terveys',     icon:'💊', color:'#e879f9' },
  { id:'lemmikki', name:'Lemmikit',                icon:'🐾', color:'#fdba74' },
  { id:'lapsi',    name:'Lapset ja vauvat',        icon:'👶', color:'#bef264' },
  { id:'muu',      name:'Muut',                    icon:'📦', color:'#9494ac' }
];

// Vanhassa versiossa koti-osasto sisalsi myos hygienian, apteekkituotteet,
// lemmikit ja vauvantarvikkeet. Naita id-tunnuksia kaytetaan itemCategory-
// funktiossa vanhojen tuotteiden uudelleenarvaukseen.
const KODISTA_EROTETUT = new Set(['hygienia', 'apteekki', 'lemmikki', 'lapsi']);
const VARIPALETTI = ['#4ade80','#ff7b72','#7dd3fc','#fbbf24','#c4a0fc','#f49ac2',
                     '#38bdf8','#a5b4fc','#e0a066','#5eead4','#fca5a5','#a3b2c2'];

// Asetuksista tulevat lisäykset, piilotukset ja järjestys
let kategoriaAsetukset = { lisatyt: [], piilotetut: [], jarjestys: [] };
let CATEGORIES = [];

function rakennaKategoriat(){
  const kaikki = [...PERUSKATEGORIAT, ...(kategoriaAsetukset.lisatyt || [])];
  const piilo = new Set(kategoriaAsetukset.piilotetut || []);
  const jarj = kategoriaAsetukset.jarjestys || [];
  const nakyvat = kaikki.filter(c => c.id === 'muu' || !piilo.has(c.id));
  nakyvat.sort((a, b) => {
    if (a.id === 'muu') return 1;            // Muut aina viimeisenä
    if (b.id === 'muu') return -1;
    const ia = jarj.indexOf(a.id), ib = jarj.indexOf(b.id);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return kaikki.indexOf(a) - kaikki.indexOf(b);

// Suomen yleisimmät taivutuspäätteet, pisin ensin.
const PAATTEET = ['öitä','oita','eita','eja','iä','ia','ja','jä','it','et','ot','ut','t','a','ä'];
const YKSIKOT = /\b\d+\s?(?:g|kg|ml|l|dl|cl|kpl|pkt|prk|ps|pss|tlk|x|pack)\b|\b\d+\b/gi;

// ---- Nimen normalisointi ----
function normalisoi(t){
  return String(t || '').toLowerCase()
    .replace(/[\u2019]/g, "'").replace(/[\u2013\u2014]/g, '-')
    .replace(YKSIKOT, ' ')
    .replace(/[^\wäöå\s-]/g, ' ')
    .replace(/[\s-]+/g, ' ')
    .trim();
}
// ä/ö taitetaan vertailua varten, jottei "leipa" jää löytymättä
const taita = (t) => t.replace(/ä/g,'a').replace(/ö/g,'o').replace(/å/g,'a');

// Kaksoiskirjainten kutistus osuu sekä lyöntivirheisiin että suomen
// astevaihteluun: pepperooni -> peperoni, makkkara -> makara
function kutista(t){
  let ulos = '';
  for (const ch of t) if (ch !== ulos[ulos.length - 1]) ulos += ch;
  return ulos;
}

// Kaksisanaiset kasitellaan merkkijonona, yksisanaiset tokeneina.
let BRANDIT_MONI = [], BRANDIT_YKSI = new Set();
function rakennaBrandit(){
  BRANDIT_MONI = []; BRANDIT_YKSI = new Set();
  for (const b of BRANDIT_RAAKA){
    const t = taita(normalisoi(b));
    if (!t) continue;
    if (t.includes(' ')) BRANDIT_MONI.push(t); else BRANDIT_YKSI.add(t);
  }
  // Pisin ensin, jotta 'pirkka parhaat' poistuu ennen kuin 'pirkka' ehtii
  BRANDIT_MONI.sort((a, b) => b.length - a.length);
}
rakennaBrandit();

// Onko koko nimi pelkka brandi?
const onBrandi = (t) => BRANDIT_YKSI.has(t) || BRANDIT_MONI.indexOf(t) !== -1;

// Palauttaa nimen ilman brandeja. Yksisanaista nimea ei kosketa, jotta
// pelkka 'ELOVENA' voi yha osua sanakirjan omaan elovena-merkintaan.
// Ei koskaan palauta tyhjaa: jos kaikki sanat ovat brandeja, nimi sailyy.
function poistaBrandit(n){
  if (!n || n.indexOf(' ') === -1) return n;
  let t = ' ' + n + ' ';
  for (const b of BRANDIT_MONI) t = t.split(' ' + b + ' ').join(' ');
  const osat = t.trim().split(/\s+/).filter(o => o && !BRANDIT_YKSI.has(o));
  return osat.length ? osat.join(' ') : n;
}

// Muokkausetäisyys, keskeytyy heti kun katko ylittyy
function etaisyys(a, b, katko){
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > katko) return katko + 1;
  let edell = new Array(lb + 1);
  for (let j = 0; j <= lb; j++) edell[j] = j;
  for (let i = 1; i <= la; i++){
    const nyt = new Array(lb + 1);
    nyt[0] = i;
    let paras = i;
    for (let j = 1; j <= lb; j++){
      const hinta = a[i-1] === b[j-1] ? 0 : 1;
      nyt[j] = Math.min(edell[j] + 1, nyt[j-1] + 1, edell[j-1] + hinta);
      if (nyt[j] < paras) paras = nyt[j];
    }
    if (paras > katko) return katko + 1;
    edell = nyt;
  }
  return edell[lb];
}

// Lyhyt sana vaatii tarkan osuman, pitkässä sallitaan enemmän virheitä
const kynnys = (n) => n <= 4 ? 0 : (n <= 7 ? 1 : 2);

function variantit(n){
  const ulos = [n];
  for (const m of MUOTOSANAT){
    if (n.endsWith(m) && n.length > m.length + 2){ ulos.push(n.slice(0, -m.length).trim()); break; }
  }
  for (const v of [...ulos]){
    for (const p of PAATTEET){
      if (v.endsWith(p) && v.length - p.length >= 4){ ulos.push(v.slice(0, -p.length)); break; }
    }
  }
  return ulos;
}

    for (const w of sanat) lisaa(w, cat);
  }
  SANASTO = ulos;
  if (typeof arvausMuisti !== 'undefined') arvausMuisti.clear();
}

const arvausMuisti = new Map();   // sama nimi lasketaan vain kerran

function arvaaSanakirjasta(nimi){
  let parasP = 0, parasC = 'muu';
  const ehdota = (p, c) => { if (p > parasP){ parasP = p; parasC = c; } };

  const pohja  = taita(normalisoi(nimi));
  const puhdas = poistaBrandit(pohja);
  // Yksisanaista nimea ei riisuta, jotta 'ELOVENA' loytaa oman merkintansa.
  // Mutta jos nimi on pelkka brandi, sumea haku osuu helposti vaaraan
  // sanaan – PIRKKA on yhden merkin paassa PIIRAKASTA. Silloin vaaditaan
  // tarkka osuma, muuten tuote menee Muut-osastoon ja paatyy asetusten
  // Tunnistamattomat-listalle opetettavaksi.
  const pelkkaBrandi = puhdas === pohja && onBrandi(pohja);

  for (const n of variantit(puhdas)){
    if (!n) continue;
    const nk = kutista(n);

    for (const [wt, wk, c] of SANASTO){
      if (wt === n) ehdota(100 * wt.length + 3000, c);
      else if (wk === nk && wk.length >= 4) ehdota(100 * wt.length + 2500, c);

      const alkuI = n.lastIndexOf(wt);
      if (alkuI !== -1){
        const loppuI = alkuI + wt.length;
        // Lyhyt sana kelpaa vain nimen alusta tai lopusta, muuten 'tee'
        // löytyisi sanasta 'sateenvarjo'.
        if (!(wt.length <= 4 && alkuI !== 0 && loppuI !== n.length)){
          ehdota(100 * wt.length + 25 * loppuI + (loppuI === n.length ? 1200 : 0), c);
        }
      }
    }
    if (parasP >= 2500) continue;

    for (const [wt, wk, c] of SANASTO){
      const k = kynnys(wt.length);
      if (k){
        const d = etaisyys(wt, n, k);
        if (d <= k) ehdota(100 * wt.length + 1000 - 300 * d, c);
      }
      const kk = kynnys(wk.length);
      if (kk && wk.length >= 4){
        const dk = etaisyys(wk, nk, kk);
        if (dk <= kk) ehdota(100 * wk.length + 900 - 300 * dk, c);
      }
      // Etuliitesumeus vain taivutusmuodoille: sanan on katettava lähes koko
      // nimi, muuten yhdyssanan alkuosa voittaisi pääsanan.
      if (!k || wt.length < 4 || wt.length < n.length - 3) continue;
      for (const extra of [0, 1]){
        const pref = n.slice(0, wt.length + extra);
        if (Math.abs(pref.length - wt.length) > k) continue;
        const d2 = etaisyys(wt, pref, k);
        if (d2 <= k) ehdota(100 * wt.length + 800 - 300 * d2, c);
      }
    }
  }
  if (pelkkaBrandi && parasP < 2500) return 'muu';
  return parasP ? parasC : 'muu';
}

function guessCategory(nimi){
  const avain = opitutAvain(nimi);
  const opittu = opitut[avain];
  if (opittu && CAT_BY_ID[opittu.c]) return opittu.c;
  if (arvausMuisti.has(avain)) return arvausMuisti.get(avain);
  const tulos = arvaaSanakirjasta(nimi);
  if (arvausMuisti.size > 500) arvausMuisti.clear();
  arvausMuisti.set(avain, tulos);
  return tulos;
}

// Opittu valinta voittaa tuotteeseen tallennetun kategorian, jotta TERON
// opetus siirtyy myös ISKÄN olemassa oleville tuotteille.
// Jos kategoria on piilotettu tai poistettu, tuote päätyy Muut-osastoon
// eikä katoa näkyvistä.
function itemCategory(it){
  const opittu = opitut[opitutAvain(it.name)];
  if (opittu && CAT_BY_ID[opittu.c]) return opittu.c;
  // Ennen 5.0.0:aa hygienia, apteekki, lemmikit ja lapset olivat kaikki
  // koti-osastossa. Arvataan vanhat koti-tuotteet uudelleen, jotta ne
  // loytavat uuden osastonsa. Kasin valittu osasto on tallessa opitut-
  // listassa ja tarkistettiin jo yllä, joten se ei ylikirjoitu.
  // Mitaan ei kirjoiteta levylle: tuotteen oma cat paivittyy vasta kun
  // sita seuraavan kerran muokataan.
  if (it.cat === 'koti'){
    const uusi = guessCategory(it.name);
    if (KODISTA_EROTETUT.has(uusi) && CAT_BY_ID[uusi]) return uusi;
  }
  if (it.cat && CAT_BY_ID[it.cat]) return it.cat;
  const arvaus = guessCategory(it.name);
  return CAT_BY_ID[arvaus] ? arvaus : 'muu';
}

//  JAETUT OPIT
//  Yksi dokumentti kauppalista/_opitut, jonka MOLEMMAT käyttäjät lukevat
//  ja kirjoittavat. Kun TERO opettaa, ISKÄ saa opin heti.
// ============================================================
// Kehittajatilan diagnostiikkaa varten: viimeisimman Firestore-snapshotin
// metadata ja katkenneiden kuuntelujen maara. Nama eivat vaikuta mihinkaan
// muuhun kuin asetusten kehittajaosioon.
let viimeSnapshot = null;
let synkkaVirheita = 0;

let opitut = {};
let omatSanat = {};        // asetuksissa lisätyt hakusanat: sana -> kategoria
let tuntemattomat = {};    // Muut-osastoon päätyneet nimet
let ulkoasu = { variotsikot: true, piilotaYksi: true };
let jaettuSig = { kategoriat: null, sanakirja: null, nakyva: null };
const OPITUT_PEILI = 'kauppalista_jaettu';
const opitutRef = () => doc(db, 'kauppalista', '_opitut');

// Kaikki jaettu tila kirjoitetaan samaan dokumenttiin, jolloin Firestore-
// sääntöihin ei tarvitse koskea ja molemmat käyttäjät saavat muutokset heti.
function tallennaJaettu(osa){
  writeJSON(OPITUT_PEILI, kokoaJaettu());
  setDoc(opitutRef(), osa, { merge: true })
    .catch(err => console.warn('Jaetun tilan tallennus epäonnistui', err));
}
function kokoaJaettu(){
  return { sanat: opitut, kayttajat: KAYTTAJAT, kategoriat: kategoriaAsetukset,
           sanakirja: omatSanat, tuntemattomat, ulkoasu };
}
function otaJaettuKayttoon(d){
  const puhdas = {};
  for (const [k, v] of Object.entries(d.sanat || {})){
    if (v && typeof v === 'object' && v.c) puhdas[k] = v;
  }
  opitut = puhdas;
  if (Array.isArray(d.kayttajat) && d.kayttajat.length){
    KAYTTAJAT = d.kayttajat
      .filter(k => k && k.id)
      .map(k => ({ id: String(k.id), nimi: String(k.nimi || k.id), emoji: String(k.emoji || '👤') }));
  }
  if (d.kategoriat && typeof d.kategoriat === 'object'){
    kategoriaAsetukset = {
      lisatyt: Array.isArray(d.kategoriat.lisatyt) ? d.kategoriat.lisatyt : [],
      piilotetut: Array.isArray(d.kategoriat.piilotetut) ? d.kategoriat.piilotetut : [],
      jarjestys: Array.isArray(d.kategoriat.jarjestys) ? d.kategoriat.jarjestys : []
    };
  }
  omatSanat = (d.sanakirja && typeof d.sanakirja === 'object') ? d.sanakirja : {};
  tuntemattomat = (d.tuntemattomat && typeof d.tuntemattomat === 'object') ? d.tuntemattomat : {};
  if (d.ulkoasu && typeof d.ulkoasu === 'object'){
    ulkoasu = { variotsikot: d.ulkoasu.variotsikot !== false,
                piilotaYksi: d.ulkoasu.piilotaYksi !== false };
  }
  varmistaTilat();
  // Sanaston ja kategorioiden uudelleenrakennus tyhjentää arvausvälimuistin,
  // jolloin jokainen tuote laskettaisiin uudestaan sumealla haulla. Tehdään
  // se vain kun data oikeasti muuttui.
  const katSig = JSON.stringify(kategoriaAsetukset);
  if (katSig !== jaettuSig.kategoriat){ jaettuSig.kategoriat = katSig; rakennaKategoriat(); }
  const sanaSig = JSON.stringify(omatSanat);
  if (sanaSig !== jaettuSig.sanakirja){ jaettuSig.sanakirja = sanaSig; rakennaSanasto(); }
  if (!USERS().includes(currentUser)) currentUser = USERS()[0];
}

// Näkyvään sisältöön vaikuttava osa jaetusta tilasta
function nakyvaSig(){
  return JSON.stringify([opitut, KAYTTAJAT, kategoriaAsetukset, omatSanat, ulkoasu]);
}

function opitutAvain(nimi){
  const n = normName(nimi).replace(/[^a-z0-9äöå]+/g, '_').replace(/^_+|_+$/g, '');
  return n.slice(0, 120) || '_tyhja';
}

function learnCategory(nimi, cat){
  const avain = opitutAvain(nimi);
  if (!avain || !CAT_BY_ID[cat]) return;
  opitut[avain] = { n: normName(nimi), c: cat, t: Date.now(), by: currentUser };
  arvausMuisti.delete(avain);
  if (tuntemattomat[avain]){ delete tuntemattomat[avain];
    tallennaJaettu({ sanat: { [avain]: opitut[avain] }, tuntemattomat: { [avain]: null } }); }
  else tallennaJaettu({ sanat: { [avain]: opitut[avain] } });
}

function unlearnCategory(nimi){
  const avain = opitutAvain(nimi);
  if (!opitut[avain]) return;
  delete opitut[avain];
  arvausMuisti.delete(avain);
  tallennaJaettu({ sanat: { [avain]: null } });
  render();
}
window.unlearnCategory = unlearnCategory;

function subscribeOpitut(){
  onSnapshot(opitutRef(), (snap) => {
    otaJaettuKayttoon(snap.exists() ? (snap.data() || {}) : {});
    USERS().forEach(subscribeUser);
    // Tuntemattomien keruu kirjoittaa samaan dokumenttiin joka kerta kun
    // lisätään outo tuote. Se ei näy listalla, joten ei piirretä turhaan.
    const sig = nakyvaSig();
    if (sig !== jaettuSig.nakyva){
      jaettuSig.nakyva = sig;
      writeJSON(OPITUT_PEILI, kokoaJaettu());   // synkroninen, vain kun tarpeen
      render();
      if (view === 'asetukset') piirraAsetukset();
    } else if (view === 'asetukset'){
      piirraAsetukset();
    }
  }, (err) => {
    console.warn('Jaettua tilaa ei voitu lukea, käytetään paikallisia', err);
  });
}

// Vanhat käyttäjäkohtaiset opit siirretään kertaalleen jaettuun dokumenttiin.
async function siirraVanhatOpit(){
  if (localStorage.getItem('kauppalista_opit_siirretty')) return;
  const kootut = {};
  for (const u of USERS()){
    const vanhat = readJSON('kauppalista_opitut_' + u, {});
    for (const [nimi, cat] of Object.entries(vanhat)){
      if (!cat) continue;
      kootut[opitutAvain(nimi)] = { n: nimi, c: cat, t: Date.now(), by: u };
    }
  }
  try { localStorage.setItem('kauppalista_opit_siirretty', '1'); } catch(e){}
  if (!Object.keys(kootut).length) return;
  opitut = { ...kootut, ...opitut };
  writeJSON(OPITUT_PEILI, kokoaJaettu());
  try { await setDoc(opitutRef(), { sanat: kootut }, { merge: true }); }
  catch(err){ console.warn('Vanhojen oppien siirto ei onnistunut', err); }
}

// ============================================================
//  OSTOSHISTORIA (vain tässä puhelimessa)
//  { "maito": { n: kertaa, t: viimeksi, c: kategoria } }
// ============================================================
const histKey = () => 'kauppalista_historia_' + currentUser;

function recordHistory(name, cat){
  const key = normName(name);
  if (!key) return;
  const h = readJSON(histKey(), {});
  const prev = h[key] || { n: 0, t: 0 };
  h[key] = { n: prev.n + 1, t: Date.now(), c: cat || prev.c || 'muu' };

  const entries = Object.entries(h);
  if (entries.length > 400){
    entries.sort((a, b) => (b[1].n - a[1].n) || (b[1].t - a[1].t));
    writeJSON(histKey(), Object.fromEntries(entries.slice(0, 300)));
  } else {
    writeJSON(histKey(), h);
  }
}

function forgetHistory(name){
  const h = readJSON(histKey(), {});
  delete h[normName(name)];
  writeJSON(histKey(), h);
}

// Ensimmäisellä kerralla poimitaan nimet olemassa olevista listoista,
// jottei ehdotuslaatikko ole tyhjä heti alussa.
function seedHistory(user){
  const flag = 'kauppalista_hist_alustettu_' + user;
  if (localStorage.getItem(flag)) return;
  const h = readJSON('kauppalista_historia_' + user, {});
  states[user].lists.forEach(l => (l.items || []).forEach(it => {
    const key = normName(it.name);
    if (key && !h[key]) h[key] = { n: 1, t: Date.now(), c: it.cat || 'muu' };
  }));
  writeJSON('kauppalista_historia_' + user, h);
  try { localStorage.setItem(flag, '1'); } catch(e){}
}

function suggestFor(query){
  const h = readJSON(histKey(), {});
  const list = findList(getActive());
  const already = new Set((list ? list.items : []).map(i => normName(i.name)));
  const q = normName(query);

  let arr = Object.entries(h)
    .map(([name, v]) => ({ name, n: v.n || 1, t: v.t || 0, c: v.c }))
    .filter(x => !already.has(x.name));

  if (!q) return [];
  arr = arr.filter(x => x.name.includes(q) && x.name !== q);
  arr.sort((a, b) =>
    (a.name.startsWith(q) ? 0 : 1) - (b.name.startsWith(q) ? 0 : 1) ||
    (b.n - a.n) || (b.t - a.t));
  return arr.slice(0, 6);
}

function renderSuggestions(){
  const wrap  = document.getElementById('suggWrap');
  const chips = document.getElementById('suggChips');
  const label = document.getElementById('suggLabel');
  const input = document.getElementById('itemName');
  if (!wrap || !input) return;

  const hide = () => { wrap.classList.remove('show'); chips.innerHTML = ''; };

  // Ehdotukset näkyvät vasta kun jotain on kirjoitettu.
  const q = input.value;
  if (!normName(q)) return hide();

  const results = suggestFor(q);
  if (!results.length) return hide();

  label.textContent = 'Ehdotukset';
  chips.innerHTML = '';
  results.forEach(r => {
    const cat = (r.c && CAT_BY_ID[r.c]) ? r.c : guessCategory(r.name);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.innerHTML = `<span class="chipIcon">${CAT_BY_ID[cat].icon}</span>${r.name.toUpperCase()}`;
    b.title = 'Lisää listalle';
    // pointerdown ennen blur-tapahtumaa, jotta napautus ehtii rekisteröityä
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      addNamed(r.name.toUpperCase());
    });
    chips.appendChild(b);
  });
  wrap.classList.add('show');
}

let statusTimer = null;
function showStatus(msg, color, sticky){
  const el = document.getElementById('saveStatus');
  el.textContent = msg;
  el.style.background = color;
  el.style.color = (color === '#22c55e' || color === '#dc2626') ? '#fff' : '#000';
  el.style.opacity = '1';
  clearTimeout(statusTimer);
  if (!sticky) statusTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

function hideStatus(){
  const el = document.getElementById('saveStatus');
  clearTimeout(statusTimer);
  el.style.opacity = '0';
}

// Tilapalkki näytetään vain kun jokin on oikeasti pielessä.
// Onnistunut tallennus on hiljainen – muuten palkki välähtäisi joka rastituksesta.
let hitaanSynkanTimer = null;
function refreshStatus(){
  if (!navigator.onLine){
    clearTimeout(hitaanSynkanTimer); hitaanSynkanTimer = null;
    showStatus('📴 Ei verkkoa – tallennetaan puhelimeen', '#f97316', true);
    return;
  }
  if (pendingWrites){
    // Ilmoitetaan vasta jos synkronointi todella takkuaa yli 2 sekuntia.
    if (!hitaanSynkanTimer){
      hitaanSynkanTimer = setTimeout(() => {
        hitaanSynkanTimer = null;
        if (pendingWrites && navigator.onLine) showStatus('⏳ Synkronoidaan…', '#f97316', true);
      }, 2000);
    }
    return;
  }
  clearTimeout(hitaanSynkanTimer); hitaanSynkanTimer = null;
  hideStatus();
}
window.addEventListener('online',  refreshStatus);
window.addEventListener('offline', refreshStatus);

const peiliAjastimet = {};
function mirrorWrite(user){
  clearTimeout(peiliAjastimet[user]);
  peiliAjastimet[user] = setTimeout(() => {
    if (states[user]) writeJSON('kauppalista_mirror_' + user, states[user].lists);

function mirrorRead(user){

}

function saveList(user, list){
  const payload = {
    name: list.name || '',
    order: typeof list.order === 'number' ? list.order : 0,
    items: (list.items || []).map(i => {
      const o = { id: i.id, name: i.name || '', qty: String(i.qty ?? ''), done: !!i.done };
      if (i.cat && CAT_BY_ID[i.cat]) o.cat = i.cat;
      return o;
    }),
    updatedAt: Date.now()
  };
  mirrorWrite(user);
  setDoc(listRef(user, list.id), payload).catch(err => {
    console.error('Listan tallennus epäonnistui', err);
    showStatus('❌ Tallennus epäonnistui', '#dc2626', false);
  });
}

function removeList(user, id){
  mirrorWrite(user);
  deleteDoc(listRef(user, id)).catch(err => {
    console.error('Listan poisto epäonnistui', err);
    showStatus('❌ Poisto epäonnistui', '#dc2626', false);
  });
}

// ============================
// SIIRTYMÄ VANHASTA MALLISTA
// ============================
async function migrateIfNeeded(user){
  let legacySnap = null;
  try { legacySnap = await getDoc(legacyRef(user)); } catch(e){ return; }
  if (legacySnap.exists() && legacySnap.data().migrated) return;

  try {
    const existing = await getDocs(listsCol(user));
    if (!existing.empty){
      if (legacySnap.exists()){
        await setDoc(legacyRef(user), { migrated: true, migratedAt: Date.now() }, { merge: true });
      }
      return;
    }
  } catch(e){ return; }

  let lists = null;
  let legacyActive = null;
  if (legacySnap.exists() && legacySnap.data().json){
    try {
      const parsed = JSON.parse(legacySnap.data().json) || {};
      lists = parsed.lists || [];
      legacyActive = parsed.active || null;
    } catch(e){}
  }
  if (!lists){
    const bkp = localStorage.getItem('kauppalista_bkp_' + user);
    if (bkp){ try { lists = (JSON.parse(bkp) || {}).lists || []; } catch(e){} }
  }
  if (!lists && user === 'TERO'){
    const old = localStorage.getItem('multi_list_final');
    if (old){ try { lists = (JSON.parse(old) || {}).lists || []; } catch(e){} }
  }

  const batch = writeBatch(db);
  (lists || []).forEach((l, i) => {
    batch.set(listRef(user, l.id || rid()), {
      name: l.name || '',
      order: i,
      items: (l.items || []).map(it => ({
        id: it.id || rid(), name: it.name || '', qty: String(it.qty ?? '1'), done: !!it.done
      })),
      updatedAt: Date.now()
    });
  });
  batch.set(legacyRef(user), { migrated: true, migratedAt: Date.now() }, { merge: true });
  try {
    await batch.commit();
    // Säilytetään aiemmin auki ollut lista, jottei näkymä ole tyhjä päivityksen jälkeen.
    if (legacyActive && !active[user] && (lists || []).some(l => l.id === legacyActive)){
      setActiveLocal(user, legacyActive);
    }
  } catch(e){ console.error('Siirtymä epäonnistui', e); }
}

// ============================
// KUUNTELIJAT
// ============================
// Vertailukelpoinen tiivistelmä listoista: sama muoto tuli data sitten
// Firestoresta tai paikallisesta muistista.
function listsSig(lists){
  return JSON.stringify((lists || []).map(l => ({
    i: l.id,
    n: l.name || '',
    o: typeof l.order === 'number' ? l.order : 0,
    t: (l.items || []).map(x => [x.id, x.name || '', String(x.qty ?? ''), !!x.done, x.cat || ''])
  })));
}

function subscribeUser(user){
  if (unsubs[user]) return;
  unsubs[user] = onSnapshot(
    listsCol(user),
    { includeMetadataChanges: true },
    (snap) => {
      const lists = [];
      snap.forEach(d => {
        const data = d.data() || {};
        lists.push({
          id: d.id,
          name: data.name || '',
          order: typeof data.order === 'number' ? data.order : 0,
          items: Array.isArray(data.items) ? data.items : []
        });
      });
      lists.sort((a, b) => (a.order - b.order) || a.name.localeCompare(b.name, 'fi'));

      // Käyttäjä on voitu poistaa asetuksista kesken kuuntelun
      if (!states[user]) return;

      if (user === currentUser){
        pendingWrites = snap.metadata.hasPendingWrites;
        refreshStatus();
      }

      viimeSnapshot = {
        aika: Date.now(),
        kayttaja: user,
        valimuistista: snap.metadata.fromCache,
        odottavia: snap.metadata.hasPendingWrites,
        listoja: lists.length
      };

      const sig = listsSig(lists);
      if (sig === lastSig[user]) return;

      // Firestore kaiuttaa oman kirjoituksemme heti takaisin. Se sisältää
      // täsmälleen sen mitä ruudulla jo on, joten uudelleenpiirto olisi turha
      // – ja osuisi keskelle käynnissä olevaa siirtymäanimaatiota.
      const omaKaiku = (sig === listsSig(states[user].lists));

      lastSig[user] = sig;
      states[user].lists = lists;
      mirrorWrite(user);
      seedHistory(user);
      pruneActive(user);
      if (!omaKaiku) render();
    },
    (err) => {
      synkkaVirheita++;
      console.error('Kuuntelu katkesi', err);

let view = 'listat';

function paivitaTopbar(){

// Palkin tausta ilmestyy vasta kun sisältöä on sen alla
let palkkiKiinni = false;
function paivitaPalkinTausta(){
  const kiinni = window.scrollY > 6;
  if (kiinni === palkkiKiinni) return;
  palkkiKiinni = kiinni;
  document.getElementById('topbar').classList.toggle('kiinni', kiinni);
}
window.addEventListener('scroll', paivitaPalkinTausta, { passive: true });

const NAKYMA_MUISTI = 'kauppalista_nakyma';
function muistaNakyma(n){
  // Asetuksia ei muisteta: sovellus ei saa aueta ratasnäkymään
  try { localStorage.setItem(NAKYMA_MUISTI, n === 'asetukset' ? 'listat' : n); } catch(e){}
}

function vaihdaNakyma(uusi, suunta){
  if (view === uusi) return;
  const tee = () => {
    view = uusi;
    document.body.dataset.view = uusi;
    muistaNakyma(uusi);
    document.body.classList.remove('lisays-auki', 'luonti-auki');
    render();
    if (uusi === 'asetukset'){ piirraAsetukset(); paivitaTopbar(); }
    window.scrollTo(0, 0);
    paivitaPalkinTausta();
  };
  if (reduceMotion || !document.startViewTransition){ tee(); return; }
  const juuri = document.documentElement;
  juuri.classList.add(suunta === 'taakse' ? 'nav-taakse' : 'nav-eteen');
  const siivoa = () => juuri.classList.remove('nav-eteen', 'nav-taakse');
  try {
    const t = document.startViewTransition(tee);
    t.finished.then(siivoa, siivoa);
  } catch(e){ siivoa(); tee(); }
}

function avaaLista(id){
  setActiveLocal(currentUser, id);
  if (view === 'lista'){ render(); return; }
  try { history.pushState({ v: 'lista' }, ''); } catch(e){}
  vaihdaNakyma('lista', 'eteen');
}
window.avaaLista = avaaLista;

function taaksepain(){
  if (view === 'listat') return;
  if (history.state && history.state.v){ history.back(); return; }
  vaihdaNakyma('listat', 'taakse');
}

// Määrän säätö napeilla. Toimii myös vapaamuotoisella arvolla ("500 g"),
// jolloin muutetaan vain alussa olevaa lukua.
function saadaArvo(arvo, muutos){
  const m = String(arvo || '').match(/^\s*(\d+)(.*)$/);
  if (!m) return muutos > 0 ? '1' : String(arvo || '');
  const uusi = Math.max(1, Math.min(999, parseInt(m[1], 10) + muutos));
  return uusi + m[2];
}
window.saadaMaara = (muutos) => {
  const el = document.getElementById('itemQty');
  if (!el) return;
  el.value = saadaArvo(el.value || '1', muutos);
  varise(8);
};

// ---- Pyyhkäisyeleet ----
let ele = null;
const varise = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} };

document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1){ ele = null; return; }
  const t = e.touches[0];
  // Reunat jätetään Androidin omalle takaisin-eleelle
  if (t.clientX < 36 || t.clientX > window.innerWidth - 36){ ele = null; return; }
  ele = { x: t.clientX, y: t.clientY, aika: Date.now() };
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const alku = ele; ele = null;
  if (!alku || editingId) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - alku.x, dy = t.clientY - alku.y;
  if (Date.now() - alku.aika > 600) return;          // hidas veto = ei ele
  if (Math.abs(dx) < Math.abs(dy) * 1.8) return;      // enemmän pysty- kuin vaakasuuntaa
  if (dx > 0 && view !== 'listat'){
    if (dx < 70) return;
    varise(12); taaksepain();
  } else if (dx < 0 && view === 'listat' && findList(getActive())){
    // Listan avaaminen vaatii selvästi tarkoituksellisemman vedon kuin
    // takaisin palaaminen, jottei lista aukea vahingossa selatessa.
    if (dx > -110 || Math.abs(dx) < Math.abs(dy) * 3) return;
    varise(12); avaaLista(getActive());
  }
}, { passive: true });

const KEHITYS_MUISTI = 'kauppalista_kehitys';
let kehitysTila = false;
try { kehitysTila = localStorage.getItem(KEHITYS_MUISTI) === '1'; } catch(e){}
let kehitysNapautukset = 0, kehitysAjastin = null;

function kokoTeksti(t){
  if (t === null || t === undefined) return '–';
  if (t < 1024) return t + ' B';
  if (t < 1048576) return (t / 1024).toFixed(1) + ' kB';
  return (t / 1048576).toFixed(1) + ' MB';
}

// Kysyy service workerilta sen oman versionumeron. Palauttaa null jos
// SW ei ohjaa sivua tai ei vastaa 1,5 sekunnissa.
function kysySwVersio(){
  return new Promise((valmis) => {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    // MessageChannel puuttuu joistakin ymparistoista. Kysely on pelkkaa
    // lisatietoa, joten epaonnistuminen ei saa kaataa koko diagnostiikkaa.
    if (!sw || typeof MessageChannel === 'undefined') return valmis(null);
    let ratkaistu = false, kello = null;
    const ratkaise = (arvo) => {
      if (ratkaistu) return;
      ratkaistu = true; clearTimeout(kello); valmis(arvo);
    };
    try {
      const kanava = new MessageChannel();
      kello = setTimeout(() => ratkaise(null), 1500);
      kanava.port1.onmessage = (e) => ratkaise(e.data || null);
      sw.postMessage({ type: 'VERSIO' }, [kanava.port2]);
    } catch(e){ ratkaise(null); }
  });
}

function localStorageKoko(){
  let tavuja = 0, avaimia = 0;
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (!k || k.indexOf('kauppalista') !== 0) continue;
      tavuja += (k.length + (localStorage.getItem(k) || '').length) * 2;  // UTF-16
      avaimia++;
    }
  } catch(e){}
  return { tavuja, avaimia };
}

async function keraaDiagnostiikka(){
  const sw = await kysySwVersio();

  let arvio = {};
  try {
    if (navigator.storage && navigator.storage.estimate) arvio = await navigator.storage.estimate();
  } catch(e){}

  let valimuistit = [];
  try {
    const nimet = await caches.keys();
    valimuistit = await Promise.all(nimet.map(async (nimi) => {
      try { const c = await caches.open(nimi); return { nimi, tiedostoja: (await c.keys()).length }; }
      catch(e){ return { nimi, tiedostoja: -1 }; }
    }));
  } catch(e){}

  let reg = null;
  try { if (navigator.serviceWorker) reg = await navigator.serviceWorker.getRegistration(); }
  catch(e){}

  const ls = localStorageKoko();
  const lists = USERS().flatMap(u => (states[u] && states[u].lists) || []);

  return {
    sivuVersio: SOVELLUS_VERSIO,
    swVersio: sw ? sw.versio : null,
    swTila: !('serviceWorker' in navigator) ? 'ei tuettu'
      : !navigator.serviceWorker.controller ? 'ei ohjaa sivua'
      : (reg && reg.waiting) ? 'päivitys odottaa'
      : (reg && reg.installing) ? 'asentuu'
      : 'aktiivinen',
    valimuistit,
    tallennusKaytto: arvio.usage,
    tallennusKiintio: arvio.quota,
    lsTavuja: ls.tavuja,
    lsAvaimia: ls.avaimia,
    verkossa: navigator.onLine,
    odottaviaKirjoituksia: !!pendingWrites,
    kuuntelijoita: Object.keys(unsubs).length,
    synkkaVirheita,
    viimeSnapshot,
    listoja: lists.length,
    tuotteita: lists.reduce((sum, l) => sum + ((l.items || []).length), 0),
    kayttajia: KAYTTAJAT.length,
    kategorioita: CATEGORIES.length,
    sanastoKoko: SANASTO.length,
    opittuja: Object.keys(opitut).length,
    omiaSanoja: Object.keys(omatSanat).length,
    tunnistamattomia: Object.keys(tuntemattomat).length,
    nakyma: (matchMedia('(display-mode: standalone)').matches || navigator.standalone)
      ? 'standalone' : 'selain',
    ruutu: innerWidth + '×' + innerHeight + ' @' + (devicePixelRatio || 1) + 'x',
    kieli: navigator.language,
    selain: navigator.userAgent
  };
}

// Rivi jossa vasemmalla selite ja oikealla arvo
function kehitysKentta(sailio, nimi, arvo, lisa, korosta){
  const r = rivi();
  r.appendChild(kuvaus(nimi, lisa));
  const v = document.createElement('div');
  v.style.cssText = 'font-size:13px;font-weight:700;text-align:right;' +
    'flex:0 1 auto;min-width:0;overflow-wrap:anywhere;' +
    'font-variant-numeric:tabular-nums;color:' + (korosta ? '#f97316' : '#c8c8d8');
  v.textContent = arvo;
  r.appendChild(v);
  sailio.appendChild(r);
}

// Toimintorivi: selite omalla rivillään, nappi alla koko leveydeltä
function kehitysToiminto(sailio, nimi, selite, nappiTeksti, luokka, toiminto){
  const r = rivi(true);
  r.style.paddingLeft = '0';
  r.appendChild(kuvaus(nimi, selite));
  r.appendChild(nappi(nappiTeksti, luokka, toiminto));
  sailio.appendChild(r);
}

function piirraKehitysOsio(sisalto){
  const d = osio('🛠️ Kehittäjätila');
  const lataus = document.createElement('div');
  lataus.className = 'tyhjaOsio';
  lataus.textContent = 'Kerätään tietoja…';
  d.appendChild(lataus);
  sisalto.appendChild(d);

  keraaDiagnostiikka().then((t) => {
    if (!d.isConnected) return;          // asetukset ehdittiin piirtää uusiksi
    lataus.remove();
    const K = (nimi, arvo, lisa, korosta) => kehitysKentta(d, nimi, arvo, lisa, korosta);

    // ---- Versiot ----
    const eriVersiot = !!t.swVersio && t.swVersio !== t.sivuVersio;
    K('Sivun versio', t.sivuVersio);
    K('Service worker', t.swVersio || '–',
      eriVersiot ? 'ERI KUIN SIVU – päivitys on kesken tai sw.js:n APP_VERSION unohtui'
                 : (t.swVersio ? null : 'ei vastannut'), eriVersiot);
    K('SW-tila', t.swTila, null, t.swTila === 'päivitys odottaa');

    // ---- Yhteys ----
    K('Verkko', t.verkossa ? 'yhteydessä' : 'offline', null, !t.verkossa);
    K('Odottavia kirjoituksia', t.odottaviaKirjoituksia ? 'kyllä' : 'ei',
      null, t.odottaviaKirjoituksia);
    K('Aktiivisia kuuntelijoita', String(t.kuuntelijoita),
      t.kuuntelijoita === t.kayttajia ? null : 'odotettiin ' + t.kayttajia,
      t.kuuntelijoita !== t.kayttajia);
    K('Synkkavirheitä', String(t.synkkaVirheita), null, t.synkkaVirheita > 0);
    if (t.viimeSnapshot){
      const ika = Math.round((Date.now() - t.viimeSnapshot.aika) / 1000);
      K('Viimeisin päivitys', ika + ' s sitten',
        t.viimeSnapshot.valimuistista ? 'luettu välimuistista' : 'luettu palvelimelta');
    } else {
      K('Viimeisin päivitys', 'ei vielä', 'Firestore ei ole vastannut kertaakaan', true);
    }

    // ---- Tallennustila ----
    K('Selaimen tallennustila', kokoTeksti(t.tallennusKaytto),
      t.tallennusKiintio ? 'kiintiöstä ' + kokoTeksti(t.tallennusKiintio) : null);
    K('localStorage', kokoTeksti(t.lsTavuja), t.lsAvaimia + ' avainta');
    if (!t.valimuistit.length) K('Välimuistit', 'ei yhtään', null, true);
    t.valimuistit.forEach(c =>
      K(c.nimi, c.tiedostoja < 0 ? 'ei luettavissa' : c.tiedostoja + ' tiedostoa'));

    // ---- Data ----
    K('Listoja', String(t.listoja));
    K('Tuotteita', String(t.tuotteita));
    K('Käyttäjiä', String(t.kayttajia));
    K('Kategorioita', String(t.kategorioita));
    K('Sanaston koko', t.sanastoKoko + ' sanaa');
    K('Opittuja', String(t.opittuja));
    K('Omia hakusanoja', String(t.omiaSanoja));
    K('Tunnistamattomia', String(t.tunnistamattomia));

    // ---- Ympäristö ----
    K('Näkymä', t.nakyma);
    K('Ruutu', t.ruutu);

    // ---- Toiminnot ----
    kehitysToiminto(d, 'Päivitä luvut', 'Kerää tiedot uudelleen',
      'Päivitä', '', () => piirraAsetukset());

    kehitysToiminto(d, 'Tarkista päivitys',
      'Pakottaa service workerin hakemaan uuden version palvelimelta',
      'Tarkista', '', async () => {
        try {
          const reg = await navigator.serviceWorker.getRegistration();
          if (!reg) return showStatus('Ei service workeria', '#dc2626');
          await reg.update();
          showStatus('✅ Tarkistettu', '#22c55e');
          setTimeout(() => piirraAsetukset(), 1200);
        } catch(e){
          console.error(e);
          showStatus('❌ Tarkistus epäonnistui', '#dc2626');
        }
      });

    kehitysToiminto(d, 'Kopioi diagnostiikka',
      'Kaikki yllä olevat tiedot leikepöydälle tekstinä',
      'Kopioi', '', async () => {
        const teksti = JSON.stringify(t, null, 2);
        try {
          await navigator.clipboard.writeText(teksti);
          showStatus('✅ Kopioitu', '#22c55e');
        } catch(e){
          console.log(teksti);
          showStatus('Kopiointi ei onnistunut – tiedot konsolissa', '#f97316');
        }
      });

    kehitysToiminto(d, 'Tyhjennä välimuisti',
      'Poistaa service workerin ja kaikki sen välimuistit ja lataa sovelluksen ' +
      'uudelleen. Listat ovat Firestoressa eivätkä katoa. Vaatii verkkoyhteyden.',
      'Tyhjennä', 'vaara', async () => {
        if (!navigator.onLine){
          return showStatus('❌ Vaatii verkkoyhteyden', '#dc2626');
        }
        if (!confirm('Tyhjennetäänkö välimuisti ja ladataanko sovellus uudelleen?\n\n' +
                     'Listat säilyvät. Sovellus haetaan kokonaan uudelleen verkosta.')) return;
        showStatus('Tyhjennetään…', '#f97316', true);
        try {
          const nimet = await caches.keys();
          await Promise.all(nimet.map(n => caches.delete(n)));
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        } catch(e){ console.error('Välimuistin tyhjennys epäonnistui', e); }
        location.reload();
      });

    kehitysToiminto(d, 'Poistu kehittäjätilasta', 'Osio piilotetaan taas',
      'Poistu', '', () => {
        kehitysTila = false;
        try { localStorage.removeItem(KEHITYS_MUISTI); } catch(e){}
        piirraAsetukset();
      });
  }).catch((e) => {
    console.error('Diagnostiikan keruu epäonnistui', e);
    lataus.textContent = 'Tietojen keruu epäonnistui – katso konsoli.';
  });
}

function piirraVersioKortti(sisalto){
  const v = document.createElement('div');
  v.className = 'asetusKortti';
  v.style.cssText = 'text-align:center;padding:18px 16px;' +
                    '-webkit-user-select:none;user-select:none;';
  const teksti = document.createElement('div');
  teksti.style.cssText = 'font-size:12px;color:#5f5f75;letter-spacing:1px;';
  teksti.textContent = 'Kauppalista ' + SOVELLUS_VERSIO;
  v.appendChild(teksti);

  if (!kehitysTila){
    v.style.cursor = 'pointer';
    v.onclick = () => {
      kehitysNapautukset++;
      clearTimeout(kehitysAjastin);
      kehitysAjastin = setTimeout(() => {
        kehitysNapautukset = 0;
        teksti.textContent = 'Kauppalista ' + SOVELLUS_VERSIO;
      }, 1500);
      if (kehitysNapautukset >= 7){
        kehitysNapautukset = 0;
        kehitysTila = true;
        try { localStorage.setItem(KEHITYS_MUISTI, '1'); } catch(e){}
        varise(40);
        piirraAsetukset();
      } else if (kehitysNapautukset >= 4){
        teksti.textContent = 'Vielä ' + (7 - kehitysNapautukset) + ' napautusta…';
      }
    };
  }
  sisalto.appendChild(v);
}

function osio(otsikko){
  const d = document.createElement('div');
  d.className = 'asetusKortti';
  d.innerHTML = `<div class="asetusOtsikko">${otsikko}</div>`;
  return d;
}
function rivi(pysty){
  const d = document.createElement('div');
  d.className = 'asetusRivi' + (pysty ? ' pysty' : '');
  return d;
}
function kuvaus(teksti, lisa){
  const d = document.createElement('div');
  d.className = 'kuvaus';
  d.textContent = teksti;
  if (lisa){
    const l = document.createElement('div');
    l.className = 'lisatieto'; l.textContent = lisa;
    d.appendChild(l);
  }
  return d;
}
function nappi(teksti, luokka, toiminto){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pikkuNappi' + (luokka ? ' ' + luokka : '');
  b.textContent = teksti;
  b.onclick = toiminto;
  return b;
}
function kytkin(paalla, toiminto){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'kytkin' + (paalla ? ' paalla' : '');
  b.setAttribute('role', 'switch');
  b.setAttribute('aria-checked', paalla ? 'true' : 'false');
  b.onclick = toiminto;
  return b;
}

// ---------- Asetusten toiminnot ----------
function lisaaKayttaja(){
  const nimi = (document.getElementById('uusiKayttajaNimi').value || '').trim().toUpperCase();
  const emoji = (document.getElementById('uusiEmoji').value || '👤').trim() || '👤';
  if (!nimi) return;
  if (KAYTTAJAT.some(k => k.nimi === nimi)) return;
  KAYTTAJAT = [...KAYTTAJAT, { id: 'k' + rid(), nimi, emoji }];
  varmistaTilat();
  tallennaJaettu({ kayttajat: KAYTTAJAT });
  USERS().forEach(subscribeUser);
  piirraAsetukset(); render();
}

function muokkaaKayttaja(id){
  const k = kayttaja(id);
  const nimi = (prompt('Käyttäjän nimi', k.nimi) || '').trim().toUpperCase();
  if (!nimi) return;
  const emoji = (prompt('Emoji', k.emoji) || k.emoji).trim() || k.emoji;
  KAYTTAJAT = KAYTTAJAT.map(x => x.id === id ? { ...x, nimi, emoji } : x);
  tallennaJaettu({ kayttajat: KAYTTAJAT });
  piirraAsetukset(); render();
}

async function poistaKayttaja(id){
  const k = kayttaja(id);
  const listat = ((states[id] || {}).lists || []).length;
  if (!confirm(`Poistetaanko ${k.nimi} ja hänen ${listat} listaansa pysyvästi?`)) return;
  // Listat poistetaan pysyvästi, kuten sovittiin
  for (const l of ((states[id] || {}).lists || [])){
    try { await deleteDoc(listRef(id, l.id)); } catch(e){ console.warn(e); }
  }
  if (unsubs[id]){ try { unsubs[id](); } catch(e){} delete unsubs[id]; }
  delete states[id]; delete active[id]; delete lastSig[id];
  try { localStorage.removeItem('kauppalista_mirror_' + id); } catch(e){}
  KAYTTAJAT = KAYTTAJAT.filter(x => x.id !== id);
  if (currentUser === id) currentUser = USERS()[0];
  varmistaTilat();
  tallennaJaettu({ kayttajat: KAYTTAJAT });
  piirraAsetukset(); render();
}

function lisaaKategoria(){
  const nimi = (document.getElementById('uusiKatNimi').value || '').trim();
  const ikoni = (document.getElementById('uusiKatIkoni').value || '🛒').trim() || '🛒';
  if (!nimi) return;
  const kaikki = [...PERUSKATEGORIAT, ...(kategoriaAsetukset.lisatyt || [])];
  const uusi = { id: 'c' + rid(), name: nimi, icon: ikoni,
                 color: VARIPALETTI[kaikki.length % VARIPALETTI.length] };
  kategoriaAsetukset.lisatyt = [...(kategoriaAsetukset.lisatyt || []), uusi];
  rakennaKategoriat();
  tallennaJaettu({ kategoriat: kategoriaAsetukset });
  document.getElementById('uusiKatNimi').value = '';
  piirraAsetukset(); render();
}

function piilotaKategoria(id, piilota){
  const nyt = new Set(kategoriaAsetukset.piilotetut || []);
  if (piilota) nyt.add(id); else nyt.delete(id);
  kategoriaAsetukset.piilotetut = [...nyt];
  rakennaKategoriat();
  tallennaJaettu({ kategoriat: kategoriaAsetukset });
  piirraAsetukset(); render();
}

function poistaKategoria(id){
  if (!confirm('Poistetaanko kategoria? Sen tuotteet siirtyvät Muut-osastoon.')) return;
  kategoriaAsetukset.lisatyt = (kategoriaAsetukset.lisatyt || []).filter(c => c.id !== id);
  kategoriaAsetukset.piilotetut = (kategoriaAsetukset.piilotetut || []).filter(x => x !== id);
  kategoriaAsetukset.jarjestys = (kategoriaAsetukset.jarjestys || []).filter(x => x !== id);
  rakennaKategoriat();
  tallennaJaettu({ kategoriat: kategoriaAsetukset });
  piirraAsetukset(); render();
}

function siirraKategoria(id, suunta){
  const nyt = CATEGORIES.filter(c => c.id !== 'muu').map(c => c.id);
  const i = nyt.indexOf(id);
  const j = i + suunta;
  if (i === -1 || j < 0 || j >= nyt.length) return;
  nyt.splice(j, 0, nyt.splice(i, 1)[0]);
  kategoriaAsetukset.jarjestys = nyt;
  rakennaKategoriat();
  tallennaJaettu({ kategoriat: kategoriaAsetukset });
  piirraAsetukset(); render();
}

function lisaaSana(){
  const sana = normName(document.getElementById('uusiSana').value || '');
  const cat = document.getElementById('uusiSanaKat').value;
  if (!sana || !CAT_BY_ID[cat]) return;
  omatSanat[sana] = cat;
  rakennaSanasto();
  tallennaJaettu({ sanakirja: { [sana]: cat } });
  document.getElementById('uusiSana').value = '';
  piirraAsetukset(); render();
}

function poistaSana(sana){
  delete omatSanat[sana];
  rakennaSanasto();
  tallennaJaettu({ sanakirja: { [sana]: null } });
  piirraAsetukset(); render();
}

// Lisää tuote nimellä (käytetään sekä lomakkeelta että ehdotuksista)
function addNamed(rawName, rawQty){
  const list = findList(getActive());
  if (!list) return;
  const name = String(rawName || '').trim().toUpperCase();
  if (!name) return;

  const qtyEl = document.getElementById('itemQty');
  const fieldQty = qtyEl ? qtyEl.value.trim() : '';
  const qty = String(rawQty ?? (fieldQty || '1'));
  const cat = guessCategory(name);

  // Kerätään nimet joita sanakirja ei tunnista, jotta ne voi opettaa asetuksissa
  if (cat === 'muu'){
    const avain = opitutAvain(name);
    if (!opitut[avain]){
      const edell = tuntemattomat[avain] || { kerrat: 0 };
      tuntemattomat[avain] = { n: normName(name), kerrat: (edell.kerrat || 0) + 1, t: Date.now() };
      tallennaJaettu({ tuntemattomat: { [avain]: tuntemattomat[avain] } });
    }
  }

  list.items.push({ id: rid(), name, qty, done: false, cat });
  recordHistory(name, cat);

  const nameEl = document.getElementById('itemName');
  if (nameEl) nameEl.value = '';
  if (qtyEl) qtyEl.value = '1';

  saveList(currentUser, list);
  render();
  renderSuggestions();
}

window.addItem = () => {
  const nameEl = document.getElementById('itemName');
  addNamed(nameEl ? nameEl.value : '');
};

window.toggle = (id) => {
  if (editingId) return;
  const list = findList(getActive());
  if (!list) return;
  const it = list.items.find(i => i.id === id);
  if (!it) return;
  it.done = !it.done;
  saveList(currentUser, list);

  // Sama nimi on annettava sekä vanhaan että uuteen tilaan, muuten selain
  // ei osaa yhdistää niitä ja rivi vain häipyy sen sijaan että liukuisi.
  vtTarget = id;
  const vanhaRivi = document.getElementById('item-' + id);
  if (vanhaRivi && !reduceMotion) vanhaRivi.style.viewTransitionName = 'vt' + id;

  renderAnimated();   // tuote liukuu ostettuihin
};

window.del = (id) => {
  const list = findList(getActive());
  if (!list) return;
  if (editingId === id) cancelEdit(true);
  const commit = () => {
    list.items = list.items.filter(i => i.id !== id);
    saveList(currentUser, list);
    render();
    renderSuggestions();
  };
  const row = document.getElementById('item-' + id);
  if (row){ row.classList.add('fadeOut'); setTimeout(commit, 400); }
  else commit();
};

window.clearAll = () => {
  const list = findList(getActive());
  if (!list) return;
  if (!confirm('Tyhjennetäänkö koko lista?')) return;
  cancelEdit(true);
  list.items = [];
  saveList(currentUser, list);
  render();
};

window.startEdit = (id) => {
  const list = findList(getActive());
  if (!list) return;
  const it = list.items.find(i => i.id === id);
  if (!it) return;
  editingId = id;
  editBuf = { name: it.name || '', qty: String(it.qty ?? '1'), cat: itemCategory(it) };
  render();
  const el = document.querySelector('[data-editfield="name"]');
  if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
};

function cancelEdit(silent){
  peruAjastin(); painallus = null;
  editingId = null;
  editBuf = null;
  if (!silent) render();
}
window.cancelEdit = () => cancelEdit(false);

window.saveEdit = () => {
  const list = findList(getActive());
  if (!list || !editingId || !editBuf) return cancelEdit(false);
  const it = list.items.find(i => i.id === editingId);
  if (!it) return cancelEdit(false);

  const newName = editBuf.name.trim().toUpperCase();
  if (!newName) return;                       // tyhjää nimeä ei tallenneta
  const oldName = it.name;

  it.name = newName;
  it.qty  = String(editBuf.qty).trim() || '1';
  it.cat  = editBuf.cat;

  // Opitaan käsin valittu kategoria seuraavaa kertaa varten
  if (editBuf.cat !== guessCategory(newName)) learnCategory(newName, editBuf.cat);
  if (normName(oldName) !== normName(newName)){
    forgetHistory(oldName);
    recordHistory(newName, editBuf.cat);
  }

  cancelEdit(true);
  saveList(currentUser, list);
  render();
  renderSuggestions();
};

function renderAnimated(){
  if (!reduceMotion && document.startViewTransition){
    try {
      const t = document.startViewTransition(() => render());
      const vapauta = () => {
        vtTarget = null;
        // Siivotaan nimi pois, ettei se jää roikkumaan seuraavaan siirtymään.
        document.querySelectorAll('#items .item').forEach(el => {
          if (el.style.viewTransitionName) el.style.viewTransitionName = '';
        });
      };
      t.finished.then(vapauta, vapauta);
      return;
    } catch(e){}
  }
  vtTarget = null;
  render();
}
