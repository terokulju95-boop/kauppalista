<!DOCTYPE html>
<html lang='fi'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1'>
<title>Kauppalistat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg);}
  33%{transform:translateY(-20px) rotate(2deg);}
  66%{transform:translateY(10px) rotate(-2deg);}
}
@keyframes gradient-text{
  0%,100%{background-position:0% center;}
  50%{background-position:100% center;}
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeOut{
  0%{opacity:1;transform:translateX(0) scale(1);}
  50%{opacity:0.5;transform:translateX(20px) scale(0.95);}
  100%{opacity:0;transform:translateX(60px) scale(0.8);height:0;padding:0;margin:0;}
}

body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  color:#ffffff;min-height:100vh;
  position:relative;overflow-x:hidden;background:#0a0a0f;
}
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 20% 20%,rgba(255,152,48,0.15) 0%,transparent 40%),
    radial-gradient(circle at 80% 80%,rgba(138,43,226,0.12) 0%,transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(30,144,255,0.08) 0%,transparent 50%);
  animation:float 20s ease-in-out infinite;pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0px,transparent 1px,transparent 2px,rgba(255,255,255,0.02) 3px);
  pointer-events:none;z-index:1;opacity:0.5;
}
.container{position:relative;z-index:2;width:100%;max-width:450px;margin:0 auto;padding:24px;min-height:100vh;}
.header{text-align:center;margin-bottom:30px;padding:20px 0;}
h1{
  font-size:38px;font-weight:700;letter-spacing:1px;margin-bottom:6px;
  background:linear-gradient(135deg,#ff9830 0%,#ffb366 50%,#ff9830 100%);
  background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:gradient-text 3s ease infinite;
  filter:drop-shadow(0 2px 8px rgba(255,152,48,0.3));
}
.subtitle{color:#888;font-size:13px;letter-spacing:4px;text-transform:uppercase;font-weight:400;}

/* Käyttäjävalinta */
.user-switcher{
  display:flex;gap:10px;margin-bottom:20px;
  background:rgba(20,20,30,0.6);border-radius:16px;padding:6px;
  border:1px solid rgba(255,255,255,0.1);
}
.user-btn{
  flex:1;padding:12px;border-radius:12px;border:none;
  font-size:16px;font-weight:800;cursor:pointer;letter-spacing:1px;
  transition:all 0.3s ease;background:transparent;color:#888;
  text-transform:uppercase;
}
.user-btn.active{
  background:linear-gradient(135deg,#ff9830 0%,#ff7a00 100%);
  color:#000;box-shadow:0 4px 15px rgba(255,152,48,0.4);
}
.user-badge{
  display:inline-block;margin-left:6px;background:rgba(255,152,48,0.3);
  color:#ff9830;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;
}

.glass-card{
  background:rgba(20,20,30,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;margin-bottom:20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.glass-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.15);
  border-color:rgba(255,152,48,0.3);
}
input{
  background:rgba(30,30,40,0.8);border:2px solid rgba(255,255,255,0.1);border-radius:14px;
  padding:14px 18px;width:100%;color:#ffffff;font-size:16px;text-transform:uppercase;
  font-weight:600;letter-spacing:0.5px;transition:all 0.3s ease;outline:none;
}
input::placeholder{color:rgba(255,255,255,0.3);}
input:focus{
  border-color:#ff9830;background:rgba(30,30,40,0.95);
  box-shadow:0 0 0 4px rgba(255,152,48,0.1);transform:translateY(-1px);
}
button{
  background:linear-gradient(135deg,#ff9830 0%,#ff7a00 100%);border:0;
  border-radius:14px;padding:14px 24px;color:#000000;font-weight:800;font-size:16px;
  cursor:pointer;text-transform:uppercase;letter-spacing:1px;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 4px 15px rgba(255,152,48,0.4);position:relative;overflow:hidden;
}
button::before{
  content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;
  background:rgba(255,255,255,0.3);transform:translate(-50%,-50%);transition:width 0.6s,height 0.6s;
}
button:hover::before{width:300px;height:300px;}
button:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,152,48,0.6);}
button:active{transform:translateY(0) scale(0.98);}
.btn-add{min-width:90px;}
.row{display:flex;width:100%;gap:12px;align-items:stretch;}
.listRow{
  background:rgba(25,25,40,0.7);backdrop-filter:blur(10px);border-radius:16px;
  padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:2px solid transparent;position:relative;overflow:hidden;
}
.listRow::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,152,48,0.1),transparent);transition:left 0.5s;
}
.listRow:hover::before{left:100%;}
.listRow:hover{background:rgba(35,35,50,0.8);transform:translateX(4px);}
.listRow.active{
  border-color:#ff9830;background:rgba(255,152,48,0.1);
  box-shadow:0 0 20px rgba(255,152,48,0.2);
}
.listRow.active::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#ff9830,#ff7a00);box-shadow:0 0 10px rgba(255,152,48,0.8);
}
.listTitleText{font-size:20px;font-weight:700;flex:1;letter-spacing:1px;color:#ffffff;transition:color 0.3s;}
.listRow.active .listTitleText{color:#ff9830;}
.count-badge{
  background:rgba(255,152,48,0.2);color:#ff9830;padding:4px 12px;border-radius:20px;
  font-size:13px;font-weight:700;margin-right:12px;border:1px solid rgba(255,152,48,0.3);
}
.delList,.del{
  background:linear-gradient(135deg,#ff4d4d 0%,#cc0000 100%);color:#ffffff;
  border-radius:12px;width:40px;height:40px;display:flex;justify-content:center;
  align-items:center;font-weight:900;font-size:20px;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:0;cursor:pointer;box-shadow:0 4px 12px rgba(255,77,77,0.4);flex-shrink:0;
}
.delList:hover,.del:hover{transform:rotate(90deg) scale(1.1);box-shadow:0 6px 20px rgba(255,77,77,0.6);}
.delList:active,.del:active{transform:rotate(90deg) scale(1);}
.item{
  background:rgba(25,25,40,0.6);backdrop-filter:blur(10px);border-radius:16px;
  padding:18px 20px;margin-bottom:12px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:2px solid rgba(255,255,255,0.05);position:relative;
}
.item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#4a9eff,#1e90ff);opacity:0;
  transition:opacity 0.3s;border-radius:16px 0 0 16px;
}
.item:hover{background:rgba(35,35,50,0.8);transform:translateX(4px);border-color:rgba(74,158,255,0.3);}
.item:hover::before{opacity:1;}
.item.doneState{opacity:0.5;background:rgba(20,40,20,0.4);}
.item.doneState::before{background:linear-gradient(180deg,#4ade80,#22c55e);}
.name{font-size:18px;font-weight:600;transition:all 0.3s ease;flex:1;letter-spacing:0.5px;}
.done{text-decoration:line-through;opacity:0.6;}
.kpl{
  opacity:0.7;margin-right:14px;font-size:15px;font-weight:600;color:#a0a0a0;
  transition:all 0.3s ease;padding:6px 12px;background:rgba(255,255,255,0.05);border-radius:8px;
}
.fadeOut{animation:fadeOut 0.4s cubic-bezier(0.4,0,1,1) forwards;}
.clearBtn{
  background:linear-gradient(135deg,#ff4d4d 0%,#cc0000 100%);color:#ffffff;
  width:100%;font-size:16px;padding:16px;border-radius:14px;border:0;margin-top:24px;
  font-weight:800;text-transform:uppercase;letter-spacing:1px;
  box-shadow:0 4px 15px rgba(255,77,77,0.4);cursor:pointer;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.clearBtn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,77,77,0.6);}
.clearBtn:active{transform:translateY(0) scale(0.98);}
.divider{
  height:2px;background:linear-gradient(90deg,transparent,rgba(255,152,48,0.3),transparent);
  margin:32px 0;border:0;position:relative;
}
.divider::after{
  content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#0a0a0f;padding:0 12px;color:#ff9830;font-size:12px;
}
#activeArea{animation:slideIn 0.4s cubic-bezier(0.4,0,0.2,1);}
.list-title-section{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;padding:20px;
  background:rgba(255,152,48,0.05);border-radius:16px;border:1px solid rgba(255,152,48,0.2);
}
.list-title-section h2{color:#ff9830;font-size:28px;font-weight:800;letter-spacing:1px;margin:0;}
.empty-state{text-align:center;padding:60px 20px;opacity:0.5;}
.empty-state-icon{font-size:64px;margin-bottom:16px;opacity:0.3;}
.empty-state-text{font-size:16px;color:#a0a0a0;letter-spacing:1px;}
html{scroll-behavior:smooth;}
::selection{background:rgba(255,152,48,0.3);color:#ffffff;}

/* Tallennusindikaattori */
#saveStatus{
  position:fixed;top:0;left:0;right:0;padding:8px;text-align:center;
  font-size:13px;font-weight:700;z-index:9999;transition:opacity 0.5s;opacity:0;
  pointer-events:none;
}

/* Päivitysilmoitus */
#updateBar{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:10000;
  display:none;align-items:center;gap:12px;
  background:rgba(20,20,30,0.96);backdrop-filter:blur(20px);
  border:1px solid rgba(255,152,48,0.4);border-radius:16px;padding:14px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
}
#updateBar.show{display:flex;animation:slideIn 0.3s cubic-bezier(0.4,0,0.2,1);}
#updateBar .txt{flex:1;font-size:14px;font-weight:600;color:#fff;letter-spacing:0.3px;}
#updateBar button{padding:10px 16px;font-size:14px;border-radius:12px;flex-shrink:0;}
/* ---------- Kategoriaotsikot ---------- */
.catHeader{
  display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding:0 4px;
  font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8b8ba0;
}
.catHeader:first-child{margin-top:4px;}
.catHeader .catIcon{font-size:16px;letter-spacing:0;}
.catHeader .catLine{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0.14),transparent);}
.catHeader .catCount{color:#5f5f75;font-weight:700;letter-spacing:1px;}
.catHeader.doneHeader{color:#4ade80;cursor:pointer;user-select:none;margin-top:26px;}
.catHeader.doneHeader .catLine{background:linear-gradient(90deg,rgba(74,222,128,0.25),transparent);}
.catHeader.doneHeader .chev{transition:transform 0.25s ease;font-size:11px;}
.catHeader.doneHeader.collapsed .chev{transform:rotate(-90deg);}

/* ---------- Edistyminen ---------- */
.list-title-section{flex-direction:column;align-items:stretch;gap:14px;}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.progressWrap{display:flex;align-items:center;gap:12px;}
.progressBar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,0.08);overflow:hidden;}
.progressFill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4ade80,#22c55e);transition:width 0.45s cubic-bezier(0.4,0,0.2,1);}
.progressText{font-size:12px;font-weight:700;letter-spacing:1px;color:#9a9ab0;white-space:nowrap;}
.hideBtn{
  background:rgba(255,255,255,0.06);color:#c8c8d8;border:1px solid rgba(255,255,255,0.12);
  box-shadow:none;padding:9px 14px;font-size:11px;letter-spacing:1px;border-radius:11px;white-space:nowrap;
}
.hideBtn:hover{background:rgba(255,255,255,0.12);color:#fff;transform:none;box-shadow:none;}

/* ---------- Ehdotukset ---------- */
.suggWrap{margin-top:12px;display:none;}
.suggWrap.show{display:block;animation:slideIn 0.25s cubic-bezier(0.4,0,0.2,1);}
.suggLabel{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#6f6f88;margin-bottom:8px;}
.suggChips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:rgba(74,158,255,0.12);border:1px solid rgba(74,158,255,0.35);color:#9dcaff;
  border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;letter-spacing:0.5px;
  cursor:pointer;box-shadow:none;text-transform:uppercase;
}
.chip:hover{background:rgba(74,158,255,0.22);color:#fff;transform:none;box-shadow:none;}
.chip:active{transform:scale(0.96);}
.chip .chipIcon{margin-right:6px;}

/* ---------- Muokkaus ---------- */
.item.editing{border-color:rgba(255,152,48,0.55);background:rgba(40,32,22,0.92);cursor:default;flex-direction:column;align-items:stretch;gap:10px;}
.item.editing:hover{transform:none;background:rgba(40,32,22,0.92);}
.editGrid{display:flex;gap:10px;}
.editGrid .qtyBox{flex:0 0 92px;}
.editGrid .catBox{flex:1;}
.item.editing input,.item.editing select{
  padding:12px 14px;font-size:15px;border-radius:12px;text-transform:none;
}
.item.editing select{
  width:100%;background:rgba(30,30,40,0.9);border:2px solid rgba(255,255,255,0.1);
  color:#fff;font-weight:600;font-family:inherit;outline:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff9830' stroke-width='3'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:38px;
}
.item.editing select:focus{border-color:#ff9830;}
.editActions{display:flex;gap:10px;}
.editActions button{flex:1;padding:12px;font-size:14px;}
.btnCancel{background:rgba(255,255,255,0.08);color:#d8d8e8;box-shadow:none;border:1px solid rgba(255,255,255,0.12);}
.btnCancel:hover{background:rgba(255,255,255,0.16);color:#fff;box-shadow:none;}

/* ---------- Rivin napit ---------- */
.rowBtns{display:flex;align-items:center;gap:8px;}
.edit{
  background:rgba(255,255,255,0.07);color:#cfcfe4;border:1px solid rgba(255,255,255,0.14);
  border-radius:12px;width:38px;height:38px;display:flex;justify-content:center;align-items:center;
  font-size:16px;cursor:pointer;box-shadow:none;flex-shrink:0;padding:0;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.edit:hover{background:rgba(255,152,48,0.18);border-color:rgba(255,152,48,0.5);color:#ff9830;transform:none;box-shadow:none;}
.edit:active{transform:scale(0.92);}
.del{width:38px;height:38px;font-size:18px;}
.kpl{margin-right:10px;padding:5px 10px;font-size:14px;}
.name{font-size:17px;}

/* ---------- Pitkien nimien rivitys ---------- */
/* Flex-elementin oletus min-width:auto estää kutistumisen, jolloin pitkä
   yhdyssana työntää napit ruudun ulkopuolelle. Nollaus + sanan katkaisu. */
html{overflow-x:hidden;}
.item{gap:10px;}
/* break-word katkaisee sanan vasta kun se ei muuten mahdu, toisin kuin
   anywhere, joka katkoo herkästi keskeltä lyhyitäkin nimiä. */
.item .name{flex:1 1 auto;min-width:0;overflow-wrap:break-word;}
.rowBtns{flex:0 0 auto;gap:6px;}
.kpl{white-space:nowrap;flex-shrink:0;margin-right:6px;padding:4px 8px;font-size:13px;}
/* Tilaa nimelle: kapeampi sisennys ja hieman pienemmät napit */
.item{padding:16px;gap:8px;}
.edit,.del{width:36px;height:36px;}
.listRow{gap:10px;}
.listTitleText{min-width:0;overflow-wrap:break-word;}
.listRow > div:last-child{flex-shrink:0;}
.titleRow h2{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;word-break:break-word;}
.hideBtn{flex:0 0 auto;}
.chip{max-width:100%;overflow-wrap:break-word;text-align:left;}
.catHeader > span:nth-child(2){min-width:0;overflow-wrap:break-word;}
.item.editing input,.item.editing select{max-width:100%;}

/* ---------- Liikkeen vähennys ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
}

</style>

<link rel="apple-touch-icon" href="/kauppalista/icons/icon-192.png">
</head>
<body>

<div id="saveStatus"></div>

<div id="updateBar">
  <div class="txt">Uusi versio on valmiina.</div>
  <button id="updateBtn" type="button">Päivitä</button>
</div>

<div class='container'>
  <div class='header'>
    <h1>Kauppalistat</h1>
    <div class='subtitle'>Älykäs ostoslista</div>
  </div>

  <!-- Käyttäjävalinta -->
  <div class='user-switcher'>
    <button class='user-btn' id='btn-TERO' onclick='switchUser("TERO")'>🧔 TERO</button>
    <button class='user-btn' id='btn-ISKÄ' onclick='switchUser("ISKÄ")'>👴 ISKÄ</button>
  </div>

  <div class='glass-card'>
    <div class='row'>
      <div style='flex:1;'>
        <input id='newListName' placeholder='Uuden listan nimi...' oninput='this.value=this.value.toUpperCase()'>
      </div>
      <button class='btn-add' onclick='addList()'>Luo</button>
    </div>
  </div>

  <section id='listContainer'></section>
  <hr class='divider'>
  <section id='activeArea' style='display:none;'>
    <div class='list-title-section'>
      <div class='titleRow'>
        <h2 id='listTitle'></h2>
        <button class='hideBtn' id='hideDoneBtn' type='button' onclick='toggleHideDone()'>Piilota ostetut</button>
      </div>
      <div class='progressWrap'>
        <div class='progressBar'><div class='progressFill' id='progressFill'></div></div>
        <div class='progressText' id='progressText'></div>
      </div>
    </div>
    <div class='glass-card'>
      <div class='row' style='margin-bottom:12px;'>
        <div style='flex:3;'>
          <input id='itemName' placeholder='Tuote...' autocomplete='off'>
        </div>
        <div style='flex:1;'>
          <input id='itemQty' value='1' inputmode='numeric' pattern='[0-9]*'>
        </div>
      </div>
      <button class='btn-add' style='width:100%;' onclick='addItem()'>Lisää tuote</button>
      <div class='suggWrap' id='suggWrap'>
        <div class='suggLabel' id='suggLabel'>Ehdotukset</div>
        <div class='suggChips' id='suggChips'></div>
      </div>
    </div>
    <div id='items'></div>
    <button class='clearBtn' onclick='clearAll()'>🗑️ Tyhjennä lista</button>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, collection, getDoc, getDocs, setDoc, deleteDoc, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDswdEF9J0gsHJH6Zo_8BGZrf8DVG3FwYc",
  authDomain: "hakemuspaivakirja.firebaseapp.com",
  projectId: "hakemuspaivakirja",
  storageBucket: "hakemuspaivakirja.firebasestorage.app",
  messagingSenderId: "836133210317",
  appId: "1:836133210317:web:d85131ae272ecf1938c184"
};

const app = initializeApp(firebaseConfig);

// Firestoren oma offline-varasto (IndexedDB): kirjoitukset tallentuvat
// puhelimeen heti ja jonottuvat itsestään kunnes verkko palaa.
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const USERS = ['TERO', 'ISKÄ'];
const EMOJI = { 'TERO': '🧔', 'ISKÄ': '👴' };

let states  = { 'TERO': { lists: [] }, 'ISKÄ': { lists: [] } };
let active  = { 'TERO': null, 'ISKÄ': null };
let lastSig = { 'TERO': null, 'ISKÄ': null };

let currentUser = localStorage.getItem('kauppalista_user') || 'TERO';
if (!USERS.includes(currentUser)) currentUser = 'TERO';

const unsubs = {};
let pendingWrites = false;
let ready = false;

function readJSON(key, fallback){
  try { const raw = localStorage.getItem(key); return raw ? (JSON.parse(raw) ?? fallback) : fallback; }
  catch(e){ return fallback; }
}
function writeJSON(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){}
}

// Pisin hakusana ensin, jotta tarkin osuma voittaa.
const CAT_INDEX = Object.entries(CAT_WORDS)
  .flatMap(([cat, words]) => words.map(w => [w, cat]))
  .sort((a, b) => b[0].length - a[0].length);

const normName = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');

function guessCategory(name){
  const n = normName(name);
  if (!n) return 'muu';
  const learned = readJSON('kauppalista_opitut_' + currentUser, {});
  if (learned[n] && CAT_BY_ID[learned[n]]) return learned[n];
  for (const [word, cat] of CAT_INDEX){ if (n.includes(word)) return cat; }
  return 'muu';
}

function itemCategory(it){
  return (it.cat && CAT_BY_ID[it.cat]) ? it.cat : guessCategory(it.name);
}

function learnCategory(name, cat){
  const key = 'kauppalista_opitut_' + currentUser;
  const learned = readJSON(key, {});
  learned[normName(name)] = cat;
  writeJSON(key, learned);
}


// ============================================================
//  OSTOSHISTORIA (vain tässä puhelimessa)
//  { "maito": { n: kertaa, t: viimeksi, c: kategoria } }
// ============================================================
const histKey = () => 'kauppalista_historia_' + currentUser;

function recordHistory(name, cat){
  const key = normName(name);
  if (!key) return;
  const h = readJSON(histKey(), {});
  const prev = h[key] || { n: 0, t: 0 };
  h[key] = { n: prev.n + 1, t: Date.now(), c: cat || prev.c || 'muu' };

  const entries = Object.entries(h);
  if (entries.length > 400){
    entries.sort((a, b) => (b[1].n - a[1].n) || (b[1].t - a[1].t));
    writeJSON(histKey(), Object.fromEntries(entries.slice(0, 300)));
  } else {
    writeJSON(histKey(), h);
  }
}

function forgetHistory(name){
  const h = readJSON(histKey(), {});
  delete h[normName(name)];
  writeJSON(histKey(), h);
}

// Ensimmäisellä kerralla poimitaan nimet olemassa olevista listoista,
// jottei ehdotuslaatikko ole tyhjä heti alussa.
function seedHistory(user){
  const flag = 'kauppalista_hist_alustettu_' + user;
  if (localStorage.getItem(flag)) return;
  const h = readJSON('kauppalista_historia_' + user, {});
  states[user].lists.forEach(l => (l.items || []).forEach(it => {
    const key = normName(it.name);
    if (key && !h[key]) h[key] = { n: 1, t: Date.now(), c: it.cat || 'muu' };
  }));
  writeJSON('kauppalista_historia_' + user, h);
  try { localStorage.setItem(flag, '1'); } catch(e){}
}

function suggestFor(query){
  const h = readJSON(histKey(), {});
  const list = findList(getActive());
  const already = new Set((list ? list.items : []).map(i => normName(i.name)));
  const q = normName(query);

  let arr = Object.entries(h)
    .map(([name, v]) => ({ name, n: v.n || 1, t: v.t || 0, c: v.c }))
    .filter(x => !already.has(x.name));

  if (!q) return [];
  arr = arr.filter(x => x.name.includes(q) && x.name !== q);
  arr.sort((a, b) =>
    (a.name.startsWith(q) ? 0 : 1) - (b.name.startsWith(q) ? 0 : 1) ||
    (b.n - a.n) || (b.t - a.t));
  return arr.slice(0, 6);
}

function renderSuggestions(){
  const wrap  = document.getElementById('suggWrap');
  const chips = document.getElementById('suggChips');
  const label = document.getElementById('suggLabel');
  const input = document.getElementById('itemName');
  if (!wrap || !input) return;

  const hide = () => { wrap.classList.remove('show'); chips.innerHTML = ''; };

  // Ehdotukset näkyvät vasta kun jotain on kirjoitettu.
  const q = input.value;
  if (!normName(q)) return hide();

  const results = suggestFor(q);
  if (!results.length) return hide();

  label.textContent = 'Ehdotukset';
  chips.innerHTML = '';
  results.forEach(r => {
    const cat = (r.c && CAT_BY_ID[r.c]) ? r.c : guessCategory(r.name);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.innerHTML = `<span class="chipIcon">${CAT_BY_ID[cat].icon}</span>${r.name.toUpperCase()}`;
    b.title = 'Lisää listalle';
    // pointerdown ennen blur-tapahtumaa, jotta napautus ehtii rekisteröityä
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      addNamed(r.name.toUpperCase());
    });
    chips.appendChild(b);
  });
  wrap.classList.add('show');
}

let statusTimer = null;
function showStatus(msg, color, sticky){
  const el = document.getElementById('saveStatus');
  el.textContent = msg;
  el.style.background = color;
  el.style.color = (color === '#22c55e' || color === '#dc2626') ? '#fff' : '#000';
  el.style.opacity = '1';
  clearTimeout(statusTimer);
  if (!sticky) statusTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

function hideStatus(){
  const el = document.getElementById('saveStatus');
  clearTimeout(statusTimer);
  el.style.opacity = '0';
}

// Tilapalkki näytetään vain kun jokin on oikeasti pielessä.
// Onnistunut tallennus on hiljainen – muuten palkki välähtäisi joka rastituksesta.
let hitaanSynkanTimer = null;
function refreshStatus(){
  if (!navigator.onLine){
    clearTimeout(hitaanSynkanTimer); hitaanSynkanTimer = null;
    showStatus('📴 Ei verkkoa – tallennetaan puhelimeen', '#f97316', true);
    return;
  }
  if (pendingWrites){
    // Ilmoitetaan vasta jos synkronointi todella takkuaa yli 2 sekuntia.
    if (!hitaanSynkanTimer){
      hitaanSynkanTimer = setTimeout(() => {
        hitaanSynkanTimer = null;
        if (pendingWrites && navigator.onLine) showStatus('⏳ Synkronoidaan…', '#f97316', true);
      }, 2000);
    }
    return;
  }
  clearTimeout(hitaanSynkanTimer); hitaanSynkanTimer = null;
  hideStatus();
}
window.addEventListener('online',  refreshStatus);
window.addEventListener('offline', refreshStatus);

const listsCol  = (user) => collection(db, 'kauppalista', user, 'lists');
const listRef   = (user, id) => doc(db, 'kauppalista', user, 'lists', id);
const legacyRef = (user) => doc(db, 'kauppalista', user);

// ============================
// PAIKALLINEN PEILI
// ============================
function mirrorWrite(user){ writeJSON('kauppalista_mirror_' + user, states[user].lists); }
function mirrorRead(user){
  const v = readJSON('kauppalista_mirror_' + user, null);
  if (Array.isArray(v)) states[user].lists = v;
}

// ============================
// KIRJOITUKSET
// ============================
function saveList(user, list){
  const payload = {
    name: list.name || '',
    order: typeof list.order === 'number' ? list.order : 0,
    items: (list.items || []).map(i => {
      const o = { id: i.id, name: i.name || '', qty: String(i.qty ?? ''), done: !!i.done };
      if (i.cat && CAT_BY_ID[i.cat]) o.cat = i.cat;
      return o;
    }),
    updatedAt: Date.now()
  };
  mirrorWrite(user);
  setDoc(listRef(user, list.id), payload).catch(err => {
    console.error('Listan tallennus epäonnistui', err);
    showStatus('❌ Tallennus epäonnistui', '#dc2626', false);
  });
}

function removeList(user, id){
  mirrorWrite(user);
  deleteDoc(listRef(user, id)).catch(err => {
    console.error('Listan poisto epäonnistui', err);
    showStatus('❌ Poisto epäonnistui', '#dc2626', false);
  });
}

// ============================
// SIIRTYMÄ VANHASTA MALLISTA
// ============================
async function migrateIfNeeded(user){
  let legacySnap = null;
  try { legacySnap = await getDoc(legacyRef(user)); } catch(e){ return; }
  if (legacySnap.exists() && legacySnap.data().migrated) return;

  try {
    const existing = await getDocs(listsCol(user));
    if (!existing.empty){
      if (legacySnap.exists()){
        await setDoc(legacyRef(user), { migrated: true, migratedAt: Date.now() }, { merge: true });
      }
      return;
    }
  } catch(e){ return; }

  let lists = null;
  let legacyActive = null;
  if (legacySnap.exists() && legacySnap.data().json){
    try {
      const parsed = JSON.parse(legacySnap.data().json) || {};
      lists = parsed.lists || [];
      legacyActive = parsed.active || null;
    } catch(e){}
  }
  if (!lists){
    const bkp = localStorage.getItem('kauppalista_bkp_' + user);
    if (bkp){ try { lists = (JSON.parse(bkp) || {}).lists || []; } catch(e){} }
  }
  if (!lists && user === 'TERO'){
    const old = localStorage.getItem('multi_list_final');
    if (old){ try { lists = (JSON.parse(old) || {}).lists || []; } catch(e){} }
  }

  const batch = writeBatch(db);
  (lists || []).forEach((l, i) => {
    batch.set(listRef(user, l.id || rid()), {
      name: l.name || '',
      order: i,
      items: (l.items || []).map(it => ({
        id: it.id || rid(), name: it.name || '', qty: String(it.qty ?? '1'), done: !!it.done
      })),
      updatedAt: Date.now()
    });
  });
  batch.set(legacyRef(user), { migrated: true, migratedAt: Date.now() }, { merge: true });
  try {
    await batch.commit();
    // Säilytetään aiemmin auki ollut lista, jottei näkymä ole tyhjä päivityksen jälkeen.
    if (legacyActive && !active[user] && (lists || []).some(l => l.id === legacyActive)){
      setActiveLocal(user, legacyActive);
    }
  } catch(e){ console.error('Siirtymä epäonnistui', e); }
}

// ============================
// KUUNTELIJAT
// ============================
// Vertailukelpoinen tiivistelmä listoista: sama muoto tuli data sitten
// Firestoresta tai paikallisesta muistista.
function listsSig(lists){
  return JSON.stringify((lists || []).map(l => ({
    i: l.id,
    n: l.name || '',
    o: typeof l.order === 'number' ? l.order : 0,
    t: (l.items || []).map(x => [x.id, x.name || '', String(x.qty ?? ''), !!x.done, x.cat || ''])
  })));
}

function subscribeUser(user){
  if (unsubs[user]) return;
  unsubs[user] = onSnapshot(
    listsCol(user),
    { includeMetadataChanges: true },
    (snap) => {
      const lists = [];
      snap.forEach(d => {
        const data = d.data() || {};
        lists.push({
          id: d.id,
          name: data.name || '',
          order: typeof data.order === 'number' ? data.order : 0,
          items: Array.isArray(data.items) ? data.items : []
        });
      });
      lists.sort((a, b) => (a.order - b.order) || a.name.localeCompare(b.name, 'fi'));

      if (user === currentUser){
        pendingWrites = snap.metadata.hasPendingWrites;
        refreshStatus();
      }

      const sig = listsSig(lists);
      if (sig === lastSig[user]) return;

      // Firestore kaiuttaa oman kirjoituksemme heti takaisin. Se sisältää
      // täsmälleen sen mitä ruudulla jo on, joten uudelleenpiirto olisi turha
      // – ja osuisi keskelle käynnissä olevaa siirtymäanimaatiota.
      const omaKaiku = (sig === listsSig(states[user].lists));

      lastSig[user] = sig;
      states[user].lists = lists;
      mirrorWrite(user);
      seedHistory(user);
      pruneActive(user);
      if (!omaKaiku) render();
    },
    (err) => {
      console.error('Kuuntelu katkesi', err);
      showStatus('❌ Yhteysvirhe', '#dc2626', false);
    }
  );
}

function getActive(){ return active[currentUser]; }

function setActiveLocal(user, id){
  active[user] = id;
  try {
    if (id) localStorage.setItem('kauppalista_active_' + user, id);
    else localStorage.removeItem('kauppalista_active_' + user);
  } catch(e){}
}

function loadActive(){
  USERS.forEach(u => {
    try { active[u] = localStorage.getItem('kauppalista_active_' + u) || null; } catch(e){ active[u] = null; }
  });
}

function pruneActive(user){
  if (active[user] && !states[user].lists.some(l => l.id === active[user])){
    setActiveLocal(user, null);
  }
}

function loadPrefs(){
  hideDone      = localStorage.getItem('kauppalista_piilota_ostetut') === '1';
  doneCollapsed = localStorage.getItem('kauppalista_ostetut_kiinni') === '1';
}

window.switchUser = (user) => {
  if (user === currentUser || !USERS.includes(user)) return;
  cancelEdit(true);
  currentUser = user;
  localStorage.setItem('kauppalista_user', user);
  subscribeUser(user);
  render();
  refreshStatus();
};

function updateUserButtons(){
  USERS.forEach(u => {
    const btn = document.getElementById('btn-' + u);
    if (!btn) return;
    btn.classList.toggle('active', u === currentUser);
    const count = (states[u].lists || []).reduce(
      (s, l) => s + (l.items || []).filter(i => !i.done).length, 0);
    btn.innerHTML = EMOJI[u] + ' ' + u + (count > 0 ? `<span class="user-badge">${count}</span>` : '');
  });
}

// LISTANHALLINTA
// ============================
function findList(id){ return states[currentUser].lists.find(l => l.id === id); }

window.addList = () => {
  const input = document.getElementById('newListName');
  const n = input.value.trim().toUpperCase();
  if (!n) return;
  const lists = states[currentUser].lists;
  const order = lists.length ? Math.max(...lists.map(l => l.order || 0)) + 1 : 0;
  const list = { id: rid(), name: n, order, items: [] };
  lists.push(list);
  setActiveLocal(currentUser, list.id);
  input.value = '';
  saveList(currentUser, list);
  render();
};

window.setActive = (id) => {
  cancelEdit(true);
  setActiveLocal(currentUser, id);
  render();
};

window.deleteList = (id) => {
  if (!confirm('Poistetaanko lista pysyvästi?')) return;
  states[currentUser].lists = states[currentUser].lists.filter(l => l.id !== id);
  if (getActive() === id){ cancelEdit(true); setActiveLocal(currentUser, null); }
  removeList(currentUser, id);
  render();
};

// Lisää tuote nimellä (käytetään sekä lomakkeelta että ehdotuksista)
function addNamed(rawName, rawQty){
  const list = findList(getActive());
  if (!list) return;
  const name = String(rawName || '').trim().toUpperCase();
  if (!name) return;

  const qtyEl = document.getElementById('itemQty');
  const fieldQty = qtyEl ? qtyEl.value.trim() : '';
  const qty = String(rawQty ?? (fieldQty || '1'));
  const cat = guessCategory(name);

  list.items.push({ id: rid(), name, qty, done: false, cat });
  recordHistory(name, cat);

  const nameEl = document.getElementById('itemName');
  if (nameEl) nameEl.value = '';
  if (qtyEl) qtyEl.value = '1';

  saveList(currentUser, list);
  render();
  renderSuggestions();
}

window.addItem = () => {
  const nameEl = document.getElementById('itemName');
  addNamed(nameEl ? nameEl.value : '');
};

window.toggle = (id) => {
  if (editingId) return;
  const list = findList(getActive());
  if (!list) return;
  const it = list.items.find(i => i.id === id);
  if (!it) return;
  it.done = !it.done;
  saveList(currentUser, list);

  // Sama nimi on annettava sekä vanhaan että uuteen tilaan, muuten selain
  // ei osaa yhdistää niitä ja rivi vain häipyy sen sijaan että liukuisi.
  vtTarget = id;
  const vanhaRivi = document.getElementById('item-' + id);
  if (vanhaRivi && !reduceMotion) vanhaRivi.style.viewTransitionName = 'vt' + id;

  renderAnimated();   // tuote liukuu ostettuihin
};

window.del = (id) => {
  const list = findList(getActive());
  if (!list) return;
  if (editingId === id) cancelEdit(true);
  const commit = () => {
    list.items = list.items.filter(i => i.id !== id);
    saveList(currentUser, list);
    render();
    renderSuggestions();
  };
  const row = document.getElementById('item-' + id);
  if (row){ row.classList.add('fadeOut'); setTimeout(commit, 400); }
  else commit();
};

window.clearAll = () => {
  const list = findList(getActive());
  if (!list) return;
  if (!confirm('Tyhjennetäänkö koko lista?')) return;
  cancelEdit(true);
  list.items = [];
  saveList(currentUser, list);
  render();
};

// ============================
// MUOKKAUS
// ============================
window.startEdit = (id) => {
  const list = findList(getActive());
  if (!list) return;
  const it = list.items.find(i => i.id === id);
  if (!it) return;
  editingId = id;
  editBuf = { name: it.name || '', qty: String(it.qty ?? '1'), cat: itemCategory(it) };
  render();
  const el = document.querySelector('[data-editfield="name"]');
  if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
};

function cancelEdit(silent){
  editingId = null;
  editBuf = null;
  if (!silent) render();
}
window.cancelEdit = () => cancelEdit(false);

window.saveEdit = () => {
  const list = findList(getActive());
  if (!list || !editingId || !editBuf) return cancelEdit(false);
  const it = list.items.find(i => i.id === editingId);
  if (!it) return cancelEdit(false);

  const newName = editBuf.name.trim().toUpperCase();
  if (!newName) return;                       // tyhjää nimeä ei tallenneta
  const oldName = it.name;

  it.name = newName;
  it.qty  = String(editBuf.qty).trim() || '1';
  it.cat  = editBuf.cat;

  // Opitaan käsin valittu kategoria seuraavaa kertaa varten
  if (editBuf.cat !== guessCategory(newName)) learnCategory(newName, editBuf.cat);
  if (normName(oldName) !== normName(newName)){
    forgetHistory(oldName);
    recordHistory(newName, editBuf.cat);
  }

  cancelEdit(true);
  saveList(currentUser, list);
  render();
  renderSuggestions();
};

// ============================
// OSTETUT
// ============================
window.toggleHideDone = () => {
  hideDone = !hideDone;
  try { localStorage.setItem('kauppalista_piilota_ostetut', hideDone ? '1' : '0'); } catch(e){}
  renderAnimated();
};

window.toggleDoneSection = () => {
  doneCollapsed = !doneCollapsed;
  try { localStorage.setItem('kauppalista_ostetut_kiinni', doneCollapsed ? '1' : '0'); } catch(e){}
  renderAnimated();
};

// ============================
// RENDER
// ============================
function renderAnimated(){
  if (!reduceMotion && document.startViewTransition){
    try {
      const t = document.startViewTransition(() => render());
      const vapauta = () => {
        vtTarget = null;
        // Siivotaan nimi pois, ettei se jää roikkumaan seuraavaan siirtymään.
        document.querySelectorAll('#items .item').forEach(el => {
          if (el.style.viewTransitionName) el.style.viewTransitionName = '';
        });
      };
      t.finished.then(vapauta, vapauta);
      return;
    } catch(e){}
  }
  vtTarget = null;
  render();
}

function buildEditRow(it){
  const r = document.createElement('div');
  r.className = 'item editing';
  r.id = 'item-' + it.id;
  r.onclick = (e) => e.stopPropagation();

  const nameIn = document.createElement('input');
  nameIn.type = 'text';
  nameIn.value = editBuf.name;
  nameIn.dataset.editfield = 'name';
  nameIn.placeholder = 'Tuotteen nimi';
  nameIn.oninput = () => { editBuf.name = nameIn.value; };
  nameIn.onkeydown = (e) => { if (e.key === 'Enter') window.saveEdit(); if (e.key === 'Escape') window.cancelEdit(); };

  const grid = document.createElement('div');
  grid.className = 'editGrid';

  const qtyBox = document.createElement('div');
  qtyBox.className = 'qtyBox';
  const qtyIn = document.createElement('input');
  qtyIn.type = 'text';
  qtyIn.value = editBuf.qty;
  qtyIn.dataset.editfield = 'qty';
  qtyIn.placeholder = 'Määrä';
  qtyIn.oninput = () => { editBuf.qty = qtyIn.value; };
  qtyIn.onkeydown = (e) => { if (e.key === 'Enter') window.saveEdit(); if (e.key === 'Escape') window.cancelEdit(); };
  qtyBox.appendChild(qtyIn);

  const catBox = document.createElement('div');
  catBox.className = 'catBox';
  const sel = document.createElement('select');
  sel.dataset.editfield = 'cat';
  CATEGORIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id;
    o.textContent = c.icon + '  ' + c.name;
    if (c.id === editBuf.cat) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { editBuf.cat = sel.value; };
  catBox.appendChild(sel);

  grid.append(qtyBox, catBox);

  const actions = document.createElement('div');
  actions.className = 'editActions';
  const cancel = document.createElement('button');
  cancel.type = 'button'; cancel.className = 'btnCancel'; cancel.textContent = 'Peruuta';
  cancel.onclick = () => window.cancelEdit();
  const save = document.createElement('button');
  save.type = 'button'; save.textContent = 'Tallenna';
  save.onclick = () => window.saveEdit();
  actions.append(cancel, save);

  r.append(nameIn, grid, actions);
  return r;
}

function buildItemRow(it){
  if (editingId === it.id && editBuf) return buildEditRow(it);

  const r = document.createElement('div');
  r.className = 'item' + (it.done ? ' doneState' : '');
  r.id = 'item-' + it.id;
  // Nimi annetaan VAIN liikkuvalle riville. Jos kaikki rivit nimetään,
  // selain joutuu ottamaan yhtä monta erillistä tilannekuvaa kuin listalla
  // on tuotteita, vaikka vain yksi niistä liikkuu.
  if (!reduceMotion && vtTarget === it.id) r.style.viewTransitionName = 'vt' + it.id;
  r.onclick = () => window.toggle(it.id);

  const nm = document.createElement('div');
  nm.className = 'name' + (it.done ? ' done' : '');
  nm.textContent = it.done ? '✓ ' + it.name : it.name;

  const right = document.createElement('div');
  right.className = 'rowBtns';

  const qty = String(it.qty ?? '').trim();
  if (qty){
    const qp = document.createElement('div');
    qp.className = 'kpl' + (it.done ? ' done' : '');
    qp.textContent = /^\d+$/.test(qty) ? qty + ' kpl' : qty;
    right.appendChild(qp);
  }

  const eb = document.createElement('button');
  eb.type = 'button'; eb.className = 'edit'; eb.textContent = '✎';
  eb.setAttribute('aria-label', 'Muokkaa tuotetta');
  eb.onclick = e => { e.stopPropagation(); window.startEdit(it.id); };

  const db2 = document.createElement('button');
  db2.type = 'button'; db2.className = 'del'; db2.textContent = '✖';
  db2.setAttribute('aria-label', 'Poista tuote');
  db2.onclick = e => { e.stopPropagation(); window.del(it.id); };

  right.append(eb, db2);
  r.append(nm, right);
  return r;
}

function catHeader(icon, text, count){
  const h = document.createElement('div');
  h.className = 'catHeader';
  h.innerHTML = `<span class="catIcon">${icon}</span><span>${text}</span>` +
                `<span class="catLine"></span><span class="catCount">${count}</span>`;
  return h;
}

function render(){
  updateUserButtons();
  const lists = states[currentUser].lists;
  const activeId = getActive();

  // --- Listat ---
  const lc = document.getElementById('listContainer');
  lc.innerHTML = '';
  if (!lists.length){
    lc.innerHTML = `<div class='empty-state'><div class='empty-state-icon'>📝</div><div class='empty-state-text'>Luo ensimmäinen listasi</div></div>`;
  }
  lists.forEach(l => {
    const r = document.createElement('div');
    r.className = 'listRow' + (activeId === l.id ? ' active' : '');
    r.onclick = () => window.setActive(l.id);

    const t = document.createElement('div');
    t.className = 'listTitleText';
    t.textContent = l.name;

    const rightSide = document.createElement('div');
    rightSide.style.cssText = 'display:flex;align-items:center;gap:8px;';

    const left = (l.items || []).filter(i => !i.done).length;
    if (left > 0){
      const badge = document.createElement('div');
      badge.className = 'count-badge';
      badge.textContent = left;
      rightSide.appendChild(badge);
    }

    const d = document.createElement('button');
    d.type = 'button'; d.className = 'delList'; d.textContent = '✖';
    d.setAttribute('aria-label', 'Poista lista');
    d.onclick = e => { e.stopPropagation(); window.deleteList(l.id); };
    rightSide.appendChild(d);
    r.append(t, rightSide);
    lc.appendChild(r);
  });

  // --- Aktiivinen lista ---
  const area = document.getElementById('activeArea');
  const list = activeId ? lists.find(l => l.id === activeId) : null;
  if (!list){ area.style.display = 'none'; return; }
  area.style.display = 'block';
  document.getElementById('listTitle').textContent = list.name;

  const all   = list.items || [];
  const done  = all.filter(i => i.done);
  const todo  = all.filter(i => !i.done);

  // Edistyminen
  const pct = all.length ? Math.round(done.length / all.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    all.length ? `${done.length} / ${all.length} ostettu` : 'Tyhjä lista';

  const hideBtn = document.getElementById('hideDoneBtn');
  hideBtn.textContent = hideDone ? 'Näytä ostetut' : 'Piilota ostetut';
  hideBtn.style.display = done.length ? '' : 'none';

  // Tuotteet kauppajärjestyksessä
  const items = document.getElementById('items');
  items.innerHTML = '';

  if (!all.length){
    items.innerHTML = `<div class='empty-state'><div class='empty-state-icon'>🛒</div><div class='empty-state-text'>Lista on tyhjä</div></div>`;
    return;
  }

  const groups = new Map();
  todo.forEach(it => {
    const c = itemCategory(it);
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(it);
  });

  CATEGORIES.forEach(c => {
    const group = groups.get(c.id);
    if (!group || !group.length) return;
    items.appendChild(catHeader(c.icon, c.name, group.length));
    group.forEach(it => items.appendChild(buildItemRow(it)));
  });

  if (!todo.length){
    const d = document.createElement('div');
    d.className = 'empty-state';
    d.innerHTML = `<div class='empty-state-icon'>🎉</div><div class='empty-state-text'>Kaikki ostettu!</div>`;
    items.appendChild(d);
  }

  // Ostetut omaan lohkoonsa alas
  if (done.length && !hideDone){
    const h = catHeader('✓', 'Ostetut', done.length);
    h.classList.add('doneHeader');
    if (doneCollapsed) h.classList.add('collapsed');
    h.insertAdjacentHTML('beforeend', '<span class="chev">▼</span>');
    h.onclick = () => window.toggleDoneSection();
    items.appendChild(h);
    if (!doneCollapsed) done.forEach(it => items.appendChild(buildItemRow(it)));
  }
}

// ============================
// SYÖTTÖKENTÄT
// ============================
function wireInputs(){
  const nameEl = document.getElementById('itemName');
  const qtyEl  = document.getElementById('itemQty');
  const listEl = document.getElementById('newListName');

  nameEl.addEventListener('input', () => {
    nameEl.value = nameEl.value.toUpperCase();
    renderSuggestions();
  });
  nameEl.addEventListener('focus', renderSuggestions);
  nameEl.addEventListener('blur', () => {
    setTimeout(() => document.getElementById('suggWrap').classList.remove('show'), 150);
  });
  nameEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); window.addItem(); nameEl.focus(); }
  });
  qtyEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); window.addItem(); nameEl.focus(); }
  });
  listEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); window.addList(); }
  });
}

// ============================
// KÄYNNISTYS
// ============================
async function init(){
  loadActive();
  loadPrefs();
  USERS.forEach(mirrorRead);
  wireInputs();
  render();

  for (const u of USERS) await migrateIfNeeded(u);
  USERS.forEach(subscribeUser);
  ready = true;
  refreshStatus();
}

init();

</script>

<script>
// ============================
// SERVICE WORKER + PÄIVITYSILMOITUS
// ============================
if ("serviceWorker" in navigator){
  let reloading = false;

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  navigator.serviceWorker.register("/kauppalista/sw.js", { updateViaCache: "none" })
    .then((reg) => {
      const offerUpdate = (worker) => {
        const bar = document.getElementById("updateBar");
        const btn = document.getElementById("updateBtn");
        bar.classList.add("show");
        btn.onclick = () => {
          btn.disabled = true;
          worker.postMessage({ type: "SKIP_WAITING" });
        };
      };

      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);

      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });

      // Tarkistetaan päivitys aina kun sovellus palaa etualalle
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
    })
    .catch((e) => console.error("Service workerin rekisteröinti epäonnistui", e));
}
</script>
