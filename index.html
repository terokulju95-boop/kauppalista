  vahenna.onclick = () => { qtyIn.value = saadaArvo(qtyIn.value, -1); editBuf.qty = qtyIn.value; varise(8); };
  lisaaNappi.onclick = () => { qtyIn.value = saadaArvo(qtyIn.value, 1); editBuf.qty = qtyIn.value; varise(8); };
  qtyBox.append(vahenna, qtyIn, lisaaNappi);

  const catBox = document.createElement('div');
  catBox.className = 'catBox';
  const sel = document.createElement('select');
  sel.dataset.editfield = 'cat';
  CATEGORIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id;
    o.textContent = c.icon + '  ' + c.name;
    if (c.id === editBuf.cat) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { editBuf.cat = sel.value; };
  catBox.appendChild(sel);

  grid.append(qtyBox, catBox);

  const actions = document.createElement('div');
  actions.className = 'editActions';
  const poista = document.createElement('button');
  poista.type = 'button'; poista.className = 'btnPoista'; poista.textContent = 'Poista';
  poista.onclick = () => { const id = editingId; cancelEdit(true); window.del(id); };
  const cancel = document.createElement('button');
  cancel.type = 'button'; cancel.className = 'btnCancel'; cancel.textContent = 'Peruuta';
  cancel.onclick = () => window.cancelEdit();
  const save = document.createElement('button');
  save.type = 'button'; save.textContent = 'Tallenna';
  save.onclick = () => window.saveEdit();
  actions.append(poista, cancel, save);

  r.append(nameIn, grid, actions);
  return r;
}

// Pitkä painallus: 500 ms pohjassa avaa muokkauksen, josta myös poisto.
// Lyhyt napautus rastittaa. Erillisiä nappeja ei enää tarvita.
const PITKA_PAINALLUS_MS = 500;
let painallus = null;

function peruAjastin(){
  if (painallus && painallus.ajastin){ clearTimeout(painallus.ajastin); painallus.ajastin = null; }
  if (painallus && painallus.el) painallus.el.classList.remove('painetaan');
}

// Kuuntelijat kiinnitetään KERRAN säiliöön, ei jokaiseen riviin erikseen.
// 65 tuotteen listalla rivikohtainen kiinnitys tarkoitti lähes 400
// addEventListener-kutsua joka ainoalla piirrolla.
function liitaPainallusKerran(){
  const sailio = document.getElementById('items');
  if (!sailio || sailio.dataset.painallusKiinni) return;
  sailio.dataset.painallusKiinni = '1';

  const riviJa = (e) => {
    const el = e.target.closest ? e.target.closest('.item') : null;
    if (!el || el.classList.contains('editing')) return null;
    const id = el.id.replace('item-', '');
    return id ? { el, id } : null;
  };

  sailio.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (editingId) return;
    const r = riviJa(e);
    if (!r) return;
    peruAjastin();
    r.el.classList.add('painetaan');
    painallus = {
      id: r.id, el: r.el, x: e.clientX, y: e.clientY, liikkui: false, pitka: false,
      ajastin: setTimeout(() => {
        if (!painallus || painallus.id !== r.id) return;
        painallus.pitka = true;
        r.el.classList.remove('painetaan');
        varise(18);
        window.startEdit(r.id);
      }, PITKA_PAINALLUS_MS)
    };
  });

  sailio.addEventListener('pointermove', (e) => {
    if (!painallus) return;
    if (Math.abs(e.clientX - painallus.x) > 10 || Math.abs(e.clientY - painallus.y) > 10){
      painallus.liikkui = true;
      peruAjastin();
    }
  });

  sailio.addEventListener('pointerup', (e) => {
    if (!painallus) return;
    const r = riviJa(e);
    const { liikkui, pitka, id } = painallus;
    peruAjastin();
    painallus = null;
    // Sormen liu'utus on vieritys tai pyyhkäisy, ei napautus
    if (!liikkui && !pitka && r && r.id === id) window.toggle(id);
  });

  const lopeta = () => { peruAjastin(); painallus = null; };
  sailio.addEventListener('pointercancel', lopeta);
  sailio.addEventListener('pointerleave', lopeta);
  sailio.addEventListener('contextmenu', (e) => {
    if (e.target.closest && e.target.closest('.item')) e.preventDefault();
  });
}

function buildItemRow(it){
  if (editingId === it.id && editBuf) return buildEditRow(it);

  const r = document.createElement('div');
  r.className = 'item' + (it.done ? ' doneState' : '');
  r.id = 'item-' + it.id;
  if (!reduceMotion && vtTarget === it.id) r.style.viewTransitionName = 'vt' + it.id;
  r.setAttribute('role', 'button');
  r.setAttribute('aria-label', it.name + (it.done ? ', ostettu' : ''));

  const nm = document.createElement('div');
  nm.className = 'name' + (it.done ? ' done' : '');
  nm.textContent = it.done ? '✓ ' + it.name : it.name;

  const oikea = document.createElement('div');
  oikea.className = 'rowBtns';

  // Yksi kappale on oletus, joten sen näyttäminen on turhaa kohinaa
  const qty = String(it.qty ?? '').trim();
  const naytaMaara = qty && !(ulkoasu.piilotaYksi && (qty === '1' || qty === '1 kpl'));
  if (naytaMaara){
    const qp = document.createElement('div');
    qp.className = 'kpl' + (it.done ? ' done' : '');
    qp.textContent = /^\d+$/.test(qty) ? qty + ' kpl' : qty;
    oikea.appendChild(qp);
  }

  r.append(nm, oikea);
  return r;
}

function catHeader(icon, text, count, vari){
  const h = document.createElement('div');
  h.className = 'catHeader';
  h.innerHTML = `<span class="catIcon">${icon}</span><span>${text}</span>` +
                `<span class="catLine"></span><span class="catCount">${count}</span>`;
  if (vari && ulkoasu.variotsikot){
    h.style.color = vari;
    h.querySelector('.catLine').style.background =
      `linear-gradient(90deg, ${vari}55, transparent)`;
    h.querySelector('.catCount').style.color = vari + 'aa';
  }
  return h;
}

function render(){
  updateUserButtons();
  const lists = states[currentUser].lists;
  const activeId = getActive();

  // --- Listat ---
  const lc = document.getElementById('listContainer');
  lc.innerHTML = '';
  if (!lists.length){
    lc.innerHTML = `<div class='empty-state'><div class='empty-state-icon'>📝</div><div class='empty-state-text'>Luo ensimmäinen listasi</div></div>`;
  }
  lists.forEach(l => {
    const r = document.createElement('div');
    r.className = 'listRow' + (activeId === l.id ? ' active' : '');
    r.onclick = () => window.setActive(l.id);

    const t = document.createElement('div');
    t.className = 'listTitleText';
    t.textContent = l.name;

    const rightSide = document.createElement('div');
    rightSide.style.cssText = 'display:flex;align-items:center;gap:8px;';

    const left = (l.items || []).filter(i => !i.done).length;
    if (left > 0){
      const badge = document.createElement('div');
      badge.className = 'count-badge';
      badge.textContent = left;
      rightSide.appendChild(badge);
    } else {
      const tyhja = document.createElement('div');
      tyhja.className = 'tyhjaLista';
      tyhja.textContent = (l.items || []).length ? 'valmis' : 'tyhjä';
      rightSide.appendChild(tyhja);
    }

    const d = document.createElement('button');
    d.type = 'button'; d.className = 'delList'; d.textContent = '✖';
    d.setAttribute('aria-label', 'Poista lista');
    d.onclick = e => { e.stopPropagation(); window.deleteList(l.id); };
    rightSide.appendChild(d);
    r.append(t, rightSide);
    lc.appendChild(r);
  });

  // --- Aktiivinen lista ---
  const area = document.getElementById('activeArea');
  const list = activeId ? lists.find(l => l.id === activeId) : null;
  if (!list){ area.style.display = 'none'; return; }
  area.style.display = 'block';
  document.getElementById('listTitle').textContent = list.name;
  paivitaTopbar();

  const all   = list.items || [];
  const done  = all.filter(i => i.done);
  const todo  = all.filter(i => !i.done);

  // Edistyminen
  const pct = all.length ? Math.round(done.length / all.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    all.length ? `${done.length} / ${all.length} ostettu` : 'Tyhjä lista';

  const hideBtn = document.getElementById('hideDoneBtn');
  hideBtn.textContent = hideDone ? 'Näytä ostetut' : 'Piilota ostetut';
  hideBtn.style.display = done.length ? '' : 'none';

  // Tuotteet kauppajärjestyksessä
  const items = document.getElementById('items');
  items.innerHTML = '';

  if (!all.length){
    items.innerHTML = `<div class='empty-state'><div class='empty-state-icon'>🛒</div><div class='empty-state-text'>Lista on tyhjä</div></div>`;
    return;
  }

  const groups = new Map();
  todo.forEach(it => {
    const c = itemCategory(it);
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(it);
  });

  CATEGORIES.forEach(c => {
    const group = groups.get(c.id);
    if (!group || !group.length) return;
    items.appendChild(catHeader(c.icon, c.name, group.length, c.color));
    group.forEach(it => items.appendChild(buildItemRow(it)));
  });

  if (!todo.length){
    const d = document.createElement('div');
    d.className = 'empty-state';
    d.innerHTML = `<div class='empty-state-icon'>🎉</div><div class='empty-state-text'>Kaikki ostettu!</div>`;
    items.appendChild(d);
  }

  const vinkki = document.createElement('div');
  vinkki.className = 'vinkki';
  vinkki.textContent = 'Napauta = ostettu · Paina pohjaan = muokkaa tai poista';

  // Ostetut omaan lohkoonsa alas
  if (done.length && !hideDone){
    const h = catHeader('✓', 'Ostetut', done.length);
    h.classList.add('doneHeader');
    if (doneCollapsed) h.classList.add('collapsed');
    h.insertAdjacentHTML('beforeend', '<span class="chev">▼</span>');
    h.onclick = () => window.toggleDoneSection();
    items.appendChild(h);
    if (!doneCollapsed) done.forEach(it => items.appendChild(buildItemRow(it)));
  }
  items.appendChild(vinkki);
}

// ============================
// SYÖTTÖKENTÄT
// ============================
function wireInputs(){
  liitaPainallusKerran();
  const nameEl = document.getElementById('itemName');
  const qtyEl  = document.getElementById('itemQty');
  const listEl = document.getElementById('newListName');

  nameEl.addEventListener('input', () => {
    nameEl.value = nameEl.value.toUpperCase();
    renderSuggestions();
  });
  nameEl.addEventListener('focus', renderSuggestions);
  nameEl.addEventListener('blur', () => {
    setTimeout(() => document.getElementById('suggWrap').classList.remove('show'), 150);
  });
  nameEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); window.addItem(); nameEl.focus(); }
  });
  qtyEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); window.addItem(); nameEl.focus(); }
  });
  listEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); window.addList(); }
  });
}

// ============================
// KÄYNNISTYS
// ============================
async function init(){
  loadActive();
  loadPrefs();
  USERS().forEach(mirrorRead);
  otaJaettuKayttoon(readJSON(OPITUT_PEILI, {}));   // heti käyttöön, päivittyy pilvestä
  wireInputs();
  // Avataan suoraan viimeksi käytetty lista, mutta jätetään historiaan
  // paluupiste, jotta takaisin-ele vie listoihin eikä ulos sovelluksesta.
  // Avataan lista vain jos sovellus oli listanäkymässä kun se suljettiin
  let muistettu = 'listat';
  try { muistettu = localStorage.getItem(NAKYMA_MUISTI) || 'listat'; } catch(e){}
  if (muistettu === 'lista' && getActive()){
    view = 'lista';
    document.body.dataset.view = 'lista';
    try { history.pushState({ v: 'lista' }, ''); } catch(e){}
  } else {
    document.body.dataset.view = 'listat';
  }
  render();
  subscribeOpitut();
  siirraVanhatOpit();

  for (const u of USERS()) await migrateIfNeeded(u);
  USERS().forEach(subscribeUser);
  // Siirtymä voi palauttaa aiemmin auki olleen listan vasta tässä vaiheessa,
  // joten näkymä ja piirto päivitetään sen jälkeen.
  if (view === 'listat' && muistettu === 'lista' && getActive()){
    view = 'lista';
    document.body.dataset.view = 'lista';
    try { history.pushState({ v: 'lista' }, ''); } catch(e){}
  }
  render();
  ready = true;
  refreshStatus();
}

init();

</script>

<script>
// ============================
// SERVICE WORKER + PÄIVITYSILMOITUS
// ============================
if ("serviceWorker" in navigator){
  let reloading = false;

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  navigator.serviceWorker.register("/kauppalista/sw.js", { updateViaCache: "none" })
    .then((reg) => {
      const offerUpdate = (worker) => {
        const bar = document.getElementById("updateBar");
        const btn = document.getElementById("updateBtn");
        bar.classList.add("show");
        btn.onclick = () => {
          btn.disabled = true;
          worker.postMessage({ type: "SKIP_WAITING" });
        };
      };

      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);

      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });

      // Tarkistetaan päivitys aina kun sovellus palaa etualalle
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
    })
    .catch((e) => console.error("Service workerin rekisteröinti epäonnistui", e));
}
</script>
